<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANALIZADOR JARVIS - v1.0</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-header: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-blue: #00a8ff;
            --accent-green: #4caf50;
            --accent-purple: #673ab7;
            --accent-orange: #ff9800;
            --accent-red: #f44336;
            --highlight-green: #00ff00;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TOP BAR --- */
        .top-bar {
            background-color: var(--bg-dark);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
        }
        
        .top-bar h1 {
            color: var(--accent-orange);
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-salir {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- HEADER TABS --- */
        .header-tabs {
            display: flex;
            padding: 10px 10px 0 10px;
            gap: 10px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            background-color: var(--bg-header);
            font-weight: bold;
            font-size: 14px;
            color: var(--text-main);
            border-radius: 4px 4px 0 0;
        }

        .tab.active {
            background-color: var(--accent-blue);
            color: #000;
        }

        /* --- MAIN LAYOUT --- */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- LEFT PANEL (TABLA) --- */
        .left-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            padding: 10px;
            background-color: var(--bg-dark);
        }

        /* Filtros */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .filter-select {
            background-color: var(--bg-header);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            width: 180px;
            font-weight: bold;
        }

        .filter-input {
            flex: 1;
            background-color: #ffffff;
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-clear {
            background-color: var(--bg-header);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Tabla */
        .table-container {
            flex: 1;
            overflow-y: auto;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px 12px;
            font-size: 13px;
            border-bottom: 1px solid #222;
        }

        tr:nth-child(even) {
            background-color: #252525;
        }
        
        tr:hover {
            background-color: #2a2a2a;
        }

        .col-num {
            color: var(--highlight-green);
            font-weight: bold;
        }

        .col-num span.target {
            color: var(--highlight-green);
            font-size: 14px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.4);
        }

        .col-num span.vecino {
            color: #aaaaaa;
        }

        .btn-ver {
            background-color: #444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-ver:hover {
            background-color: #666;
        }

        /* Footer prueba suerte */
        .footer-test {
            background-color: #2e7d32;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* --- RIGHT PANEL (MENU) --- */
        .right-panel {
            flex: 1;
            max-width: 300px;
            padding: 10px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-title {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .menu-btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .menu-btn:hover {
            opacity: 0.8;
        }

        .btn-purple { background-color: var(--accent-purple); }
        .btn-blue { background-color: var(--accent-blue); color: black; }
        .btn-yellow { background-color: #ffb300; color: black; }
        .btn-orange { background-color: #e65100; }
        .btn-red { background-color: #d32f2f; }

        /* Status Bar */
        .status-bar {
            background-color: #000;
            color: var(--text-muted);
            padding: 5px 15px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .status-vip {
            background-color: #333;
            color: var(--accent-orange);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <span>&#8592;</span>
            <span>&#8635;</span>
            <h1>ANALIZADOR JARVIS</h1>
        </div>
        <button class="btn-salir">SALIR</button>
    </div>

    <!-- HEADER TABS -->
    <div class="header-tabs">
        <div class="tab">LOTTO ACT</div>
        <div class="tab">GUACHARO</div>
        <div class="tab active">GUACHARITO</div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-layout">
        
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <!-- Filtros -->
            <div class="filter-bar">
                <select class="filter-select" id="tipo-filtro" onchange="filtrar()">
                    <option value="mas_recientes">Más Recientes</option>
                    <option value="historico">Histórico Completo</option>
                </select>
                <input type="text" class="filter-input" id="input-numero" placeholder="Ingrese número (Ej. 55)" value="55" oninput="filtrar()">
                <button class="btn-clear" onclick="limpiarFiltro()">LIMPIAR FILTRO</button>
            </div>

            <!-- Tabla -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Animal</th>
                            <th>Num (5 Antes [X] 5 Después)</th>
                            <th>Ver</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>

            <!-- Footer -->
            <div class="footer-test">🍀 Prueba tu Suerte</div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="menu-title">MENÚ DE FUNCIONES</div>
            <button class="menu-btn btn-purple">Explosivos</button>
            <button class="menu-btn btn-purple">Patrones</button>
            <button class="menu-btn btn-blue">Gráficos</button>
            <button class="menu-btn btn-blue">Proyección</button>
            <button class="menu-btn btn-yellow">Modo Auto</button>
            <button class="menu-btn btn-yellow">Atrasados</button>
            <button class="menu-btn btn-orange">Ruleta x N°</button>
            <button class="menu-btn btn-orange">Ruleta x N° 2</button>
        </div>
    </div>

    <!-- STATUS BAR -->
    <div class="status-bar">
        <div>
            <span>16/11/2026 | 🕒 7:45:46 p. m.</span>
            <span class="status-vip">👑 USUARIO VIP - ACCESO ILIMITADO</span>
        </div>
        <div>RESULTADOS</div>
    </div>

    <script>
        // ==========================================
        // BASE DE DATOS SIMULADA (Basada en tu JSON actualizado)
        // ==========================================
        // Nota: Reemplaza este array con el fetch a tu archivo mapeo_gua.json real.
        // He incluido los registros de "OSO HORMIGUERO" con el número 55 tal como en tu captura,
        // rodeados de números aleatorios para simular los vecinos.
        
        const datosJSON = [
            // Historial reciente basado en tu imagen (OSO HORMIGUERO con 55)
            { fecha: "04-05", hora: "06:00 PM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "30-04", hora: "02:00 PM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "28-04", hora: "09:00 AM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "25-04", hora: "03:00 PM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "11-04", hora: "10:00 AM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "05-04", hora: "11:00 AM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "24-03", hora: "10:00 AM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "20-03", hora: "07:00 PM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "15-03", hora: "01:00 PM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "13-03", hora: "07:00 PM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "06-03", hora: "04:00 PM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "22-02", hora: "12:00 PM", animal: "OSO HORMIGUERO", numero: "55" },
            { fecha: "19-02", hora: "05:00 PM", animal: "OSO HORMIGUERO", numero: "55" },
            
            // Datos "Relleno" para simular el JSON original y los vecinos
            // (Para que la función de vecinos funcione, necesitamos datos alrededor)
            ...Array.from({length: 100}, (_, i) => ({
                fecha: "2026-02", 
                hora: "12:00 PM", 
                animal: "VARIOS", 
                numero: (i % 99).toString().padStart(2, '0')
            }))
        ];

        // Mezclamos los datos para que no estén todos los 55 juntos y parezca real
        // (En tu app real, esto vendrá ordenado cronológicamente desde el JSON)
        datosJSON.sort(() => Math.random() - 0.5);

        // ==========================================
        // LÓGICA DEL FILTRO
        // ==========================================

        function filtrar() {
            const inputVal = document.getElementById('input-numero').value.trim();
            const tbody = document.getElementById('tabla-cuerpo');
            
            // Limpiar tabla
            tbody.innerHTML = '';

            if (!inputVal) return;

            const resultados = [];
            const maxApariciones = 25; // Límite solicitado

            // 1. Buscar todas las apariciones del número
            for (let i = 0; i < datosJSON.length; i++) {
                if (datosJSON[i].numero === inputVal) {
                    resultados.push({ index: i, data: datosJSON[i] });
                }
            }

            // 2. Invertir para tener los más recientes primero
            resultados.reverse();

            // 3. Limitar a 25
            const resultadosLimitados = resultados.slice(0, maxApariciones);

            if (resultadosLimitados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No se encontraron resultados para el número ${inputVal}</td></tr>`;
                return;
            }

            // 4. Construir las filas con vecinos
            resultadosLimitados.forEach(item => {
                const idx = item.index;
                const reg = item.data;

                // Obtener 5 vecinos antes y 5 después (usando slicing)
                const inicio = Math.max(0, idx - 5);
                const fin = Math.min(datosJSON.length, idx + 6); // +6 porque el final es exclusivo
                
                const vecinos = datosJSON.slice(inicio, fin);
                
                // Formatear string de números
                let numStringHTML = "";
                vecinos.forEach(v => {
                    if (v.numero === inputVal) {
                        // Resaltar el número objetivo
                        numStringHTML += `<span class="target">[${v.numero}]</span> - `;
                    } else {
                        // Números vecinos en gris
                        numStringHTML += `<span class="vecino">${v.numero}</span> - `;
                    }
                });
                
                // Quitar el último guion
                numStringHTML = numStringHTML.slice(0, -3);

                // Crear fila
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${reg.fecha}</td>
                    <td>${reg.hora}</td>
                    <td>${reg.animal}</td>
                    <td class="col-num">${numStringHTML}</td>
                    <td><button class="btn-ver">👁️</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function limpiarFiltro() {
            document.getElementById('input-numero').value = '';
            document.getElementById('tabla-cuerpo').innerHTML = '';
        }

        // Ejecutar filtro inicial con el 55 por defecto
        window.onload = () => {
            filtrar();
        };
    </script>
</body>
</html>
