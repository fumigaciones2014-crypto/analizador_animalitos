<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANALIZADOR_JARVIS</title>
    <style>
        :root {
            --bg-principal: #1a1a1a; --bg-header: #0f0f0f; --bg-panel: #2a2a2a;
            --bg-tabla: #222222; --text-blanco: #ffffff; --text-amarillo: #ffc107;
            --text-verde: #00ff00; --btn-purpura: #4a148c; --btn-verde-oscuro: #1b5e20;
            --btn-azul-oscuro: #0d47a1; --btn-gris-oscuro: #424242; --btn-amarillo: #f9a825;
            --btn-azul-claro: #29b6f6; --btn-gris: #616161; --btn-verde-footer: #2e7d32;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--text-blanco); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background-color: var(--bg-header); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        .header-title { color: var(--text-amarillo); font-size: 1.2rem; font-weight: bold; flex-grow: 1; text-align: center; letter-spacing: 1px; }
        
        .layout-container { display: grid; grid-template-columns: 1fr 300px; flex-grow: 1; overflow: hidden; }
        
        .sidebar-right { background-color: var(--bg-panel); padding: 15px; display: flex; flex-direction: column; gap: 10px; border-left: 2px solid #333; overflow-y: auto; }
        .sidebar-title { text-align: center; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; color: #ccc; }
        .btn-menu { padding: 15px 10px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; text-align: center; transition: opacity 0.2s; }
        .btn-menu:hover { opacity: 0.8; }
        .bg-purpura { background-color: var(--btn-purpura); } .bg-verde { background-color: var(--btn-verde-oscuro); }
        .bg-azul { background-color: var(--btn-azul-oscuro); } .bg-gris { background-color: var(--btn-gris-oscuro); }
        .bg-amarillo { background-color: var(--btn-amarillo); color: #000; }
        
        main { display: flex; flex-direction: column; padding: 10px; overflow: hidden; }
        .tabs-container { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; cursor: pointer; font-weight: bold; color: white; border-radius: 4px 4px 0 0; }
        .tab-active { background-color: var(--btn-azul-claro); color: #000; } .tab-inactive { background-color: var(--btn-gris); }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; }
        .toolbar select, .toolbar input { padding: 10px; border-radius: 4px; border: none; background-color: var(--btn-gris); color: white; font-weight: bold; }
        .toolbar input { flex-grow: 1; background-color: #ffffff; color: #000; }
        .btn-tool { padding: 10px 20px; border: none; border-radius: 4px; background-color: var(--btn-gris); color: white; font-weight: bold; cursor: pointer; }
        
        .table-container { flex-grow: 1; overflow-y: auto; background-color: var(--bg-tabla); margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background-color: #111; padding: 12px; position: sticky; top: 0; font-size: 0.9rem; }
        td { padding: 10px; border-bottom: 1px solid #333; }
        .num-verde { color: var(--text-verde); font-weight: bold; }
        .btn-ver { padding: 5px 15px; background-color: var(--btn-gris); border: none; border-radius: 4px; color: white; cursor: pointer; }
        
        /* Estilos del Botón de Suerte */
        .btn-add-manual { 
            width: 100%; padding: 15px; background-color: var(--btn-verde-footer); color: white; 
            border: none; font-weight: bold; font-size: 1.2rem; cursor: pointer; 
            transition: all 0.3s; border-radius: 0 0 5px 5px;
        }
        .btn-add-manual:hover { background-color: #388e3c; box-shadow: 0 0 15px rgba(76, 175, 80, 0.5); }
        .btn-add-manual:disabled { background-color: #333; color: #888; cursor: not-allowed; box-shadow: none; }

        footer { background-color: var(--bg-header); padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; border-top: 2px solid #333; }
        footer a { color: var(--btn-azul-claro); text-decoration: none; font-weight: bold; }
        footer a:hover { text-decoration: underline; }

        /* ESTILOS DEL MODAL (OJITO) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background-color: #1e1e1e; padding: 20px; border: 2px solid var(--btn-azul-claro); border-radius: 8px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; position: relative; }
        .close-btn { color: #aaa; position: absolute; top: 10px; right: 15px; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: white; }
        
        .box-modal { background-color: #222; padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #00ffcc; }
        .box-cadena { background-color: #2a1133; border-left: 4px solid #ff00cc; }
        .texto-cadena { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        .btn-ir-historial { display: block; text-align: center; background-color: #006633; color: white; text-decoration: none; padding: 12px; border-radius: 5px; font-weight: bold; margin-top: 15px; border: none; width: 100%; cursor: pointer; }
        .btn-ir-historial:hover { background-color: #008844; }

        /* MODAL DE SUERTE */
        #modal-suerte .modal-content { border-color: #4caf50; text-align: center; }
        .numeros-suerte { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .bola-suerte { 
            width: 100px; height: 100px; border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #81c784, #2e7d32);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset -5px -5px 15px rgba(0,0,0,0.3);
            font-size: 2.5rem; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .bola-suerte small { font-size: 0.8rem; margin-top: 5px; text-transform: uppercase; color: #c8e6c9;}

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .layout-container { display: flex; flex-direction: column; overflow-y: auto; }
            .sidebar-right { border-left: none; border-top: 2px solid #333; flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .btn-menu { width: 45%; padding: 10px 5px; font-size: 0.8rem; }
            .sidebar-title { width: 100%; }
            .toolbar { flex-direction: column; }
            .toolbar select, .toolbar input, .btn-tool { width: 100%; }
            .tab-btn { font-size: 0.8rem; padding: 8px; }
            .modal-content { width: 95%; padding: 15px; }
            .bola-suerte { width: 80px; height: 80px; font-size: 2rem; }
        }
    </style>
</head>
<body>

        <div></div>
        <div class="header-title">JARVIS - MULTIANALIZADOR v1.0</div>
        <button id="btn-descargas" class="btn-menu bg-azul" style="padding: 10px 20px;" onclick="window.location.href='hist_avanzado.html'">HIST_AVANZADO</button>

            <div class="toolbar">
                <select id="select-filtro" onchange="aplicarFiltros()">

            <div class="table-container">

            <button id="btn-agregar-manual" class="btn-add-manual" onclick="probarSuerte()">🍀 Prueba tu Suerte</button>

        <aside class="sidebar-right" id="sidebar-right">
            <div class="sidebar-title" id="sidebar-title">MENÚ DE FUNCIONES</div>
            <button id="btn-menu-explosivos" class="btn-menu bg-purpura" onclick="window.location.href='explosivos.html'">Explosivos</button>
            <button id="btn-menu-patrones" class="btn-menu bg-verde" onclick="window.location.href='patrones.html'">Patrones</button>
            <button id="btn-menu-graficos" class="btn-menu bg-azul" onclick="window.location.href='graficos.html'">Gráficos</button>
            <button id="btn-menu-proyeccion" class="btn-menu bg-azul" onclick="window.location.href='proyeccion.html'">Proyección</button>
            <button id="btn-menu-automatico" class="btn-menu bg-gris" onclick="window.location.href='automatico.html'">Modo Auto</button>
            <button id="btn-menu-atrasados" class="btn-menu bg-amarillo" onclick="window.location.href='atrasados.html'">Atrasados</button>
            <button id="btn-menu-funcion7" class="btn-menu bg-gris">Función_7</button>
            <button id="btn-menu-funcion8" class="btn-menu bg-gris">Función_8</button>
        </aside>
    </div>

    <footer>
        <div id="footer-reloj">Fecha y Hora Actual</div>
        <a id="footer-link-resultados" href="https://loteriadehoy.com/animalitos/resultados/" target="_blank">RESULTADOS</a>

        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModalOjo()">&times;</span>

            <div id="modal-ojo-cuerpo"></div>

    <!-- MODAL DE LA SUERTE -->
    <div id="modal-suerte" class="modal">
        <div class="modal-content">
            <h2 style="color: #4caf50; margin-bottom: 10px;">🍀 ¡Tus Números de la Suerte!</h2>
            <p style="color: #ccc;">Basado en los patrones y flancos más fuertes de hoy.</p>
            
            <div class="numeros-suerte">
                <div class="bola-suerte" id="bola-1">??</div>
                <div class="bola-suerte" id="bola-2">??</div>
            </div>
            
            <button class="btn-ir-historial" onclick="cerrarModalSuerte()" style="background-color: #4caf50;">¡Jugar Ahora!</button>

    <script>
        let datosLotto = [], datosGuacharo = [], datosMini = [], loteriaActual = 'lotto';
        let numParaHistorial = "";
        let datosFiltradosActuales = [];

        setInterval(() => {
            const ahora = new Date();
            document.getElementById('footer-reloj').innerText = `📅 ${ahora.toLocaleDateString()} | ⏰ ${ahora.toLocaleTimeString()}`;
        }, 1000);

        async function cargarDatos() {
            try {
                const [resLotto, resGua, resMini] = await Promise.all([
                    fetch('mapeo_lotto.json').then(r => r.json()),
                    fetch('mapeo_gua.json').then(r => r.json()),
                    fetch('mapeo_mini.json').then(r => r.json())
                ]);
                datosLotto = resLotto; datosGuacharo = resGua; datosMini = resMini;
                aplicarFiltros();
                verificarSuerteDisponible(); // Revisar si puede pedir suerte
            } catch (error) {
                console.error("Error cargando los JSON:", error);
            }
        }

        function renderizarTabla(datos) {
            const tbody = document.getElementById('tabla-cuerpo');
            tbody.innerHTML = '';
            const registrosAMostrar = datos.slice(-50).reverse(); 
            
            if (registrosAMostrar.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="padding: 20px; color: #888;">No se encontraron resultados.</td></tr>`;
                return;
            }

            registrosAMostrar.forEach(registro => {
                const tr = document.createElement('tr');
                const fechaParts = registro.fecha.split('-');
                let numMostrar = registro.numero.toString().padStart(2, '0');
                if(registro.numero === '??') numMostrar = '??';

                tr.innerHTML = `
                    <td>${fechaParts[2]}-${fechaParts[1]}</td>
                    <td>${registro.hora}</td>
                    <td>${registro.animal || '---'}</td>
                    <td class="num-verde">${numMostrar}</td>
                    <td><button class="btn-ver" onclick="abrirAnalisis('${registro.numero}', '${registro.hora}')">👁️</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function cambiarLoteria(loteria) {
            loteriaActual = loteria;
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('tab-inactive'); });
            document.getElementById(`tab-${loteria === 'gua' ? 'guacharo' : loteria === 'mini' ? 'guacharito' : 'lotto'}`).classList.remove('tab-inactive');
            document.getElementById(`tab-${loteria === 'gua' ? 'guacharo' : loteria === 'mini' ? 'guacharito' : 'lotto'}`).classList.add('tab-active');
            aplicarFiltros(); 
        }

        function aplicarFiltros() {
            let datosBase = loteriaActual === 'lotto' ? datosLotto : (loteriaActual === 'gua' ? datosGuacharo : datosMini);
            let textoBusqueda = document.getElementById('input-buscar').value.trim().toUpperCase();
            let orden = document.getElementById('select-filtro').value;

            let filtrados = datosBase.filter(reg => {
                let animal = (reg.animal || '').toUpperCase();
                let numero = reg.numero.toString();
                let numeroConCero = numero.padStart(2, '0');
                return animal.includes(textoBusqueda) || numero.includes(textoBusqueda) || numeroConCero.includes(textoBusqueda);
            });

            if (orden === 'numero') {
                filtrados.sort((a, b) => {
                    let numA = a.numero === '??' ? 999 : parseInt(a.numero);
                    let numB = b.numero === '??' ? 999 : parseInt(b.numero);
                    return numA - numB;
                });
            }

            datosFiltradosActuales = filtrados;
            renderizarTabla(filtrados);
        }

        function limpiarFiltros() {
            document.getElementById('input-buscar').value = '';
            document.getElementById('select-filtro').value = 'reciente';
            aplicarFiltros();
        }

        // --- LÓGICA DEL OJITO ---
        function calcularDiferenciaDias(fecha1, fecha2) {
            const f1 = new Date(fecha1 + 'T00:00:00');
            const f2 = new Date(fecha2 + 'T00:00:00');
            return Math.round((f2 - f1) / (1000 * 60 * 60 * 24));
        }

        function analizarNumeroIndividual(datosLoteria, numeroObjetivo) {
            let historialNumeros = [], fechasHoras = [];
            datosLoteria.forEach(registro => {
                let numStr = (registro.numero || '').toString().trim();
                if (numStr === '??' || isNaN(numStr)) return;
                let num = parseInt(numStr);
                let horaStr = registro.hora;
                let horaParts = horaStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                if(!horaParts) return;
                let hora = parseInt(horaParts[1]);
                let minuto = parseInt(horaParts[2]);
                let ampm = horaParts[3].toUpperCase();
                if (ampm === 'PM' && hora < 12) hora += 12;
                if (ampm === 'AM' && hora === 12) hora = 0;
                let horaDecimal = hora + (minuto / 60);
                historialNumeros.push(num);
                fechasHoras.push({ fecha: registro.fecha, horaStr: horaStr, num: num, decimal: horaDecimal });
            });

            if (historialNumeros.length === 0) return null;
            let indicesApariciones = [];
            historialNumeros.forEach((n, i) => { if (n === numeroObjetivo) indicesApariciones.push(i); });
            if (indicesApariciones.length === 0) {
                return { num: numeroObjetivo, subidas: 0, bajadas: 0, ciclo: 0, ultima: "No registrado", prediccion: "Sin datos", fecha_estimada: "N/A", dias_retraso: 0, top_atrayentes: [] };
            }

            let subidas = 0, bajadas = 0;
            indicesApariciones.forEach(idx => {
                if (idx > 0) {
                    if (historialNumeros[idx] > historialNumeros[idx-1]) subidas++;
                    else if (historialNumeros[idx] < historialNumeros[idx-1]) bajadas++;
                }
            });

            let ciclos = [];
            for (let i = 1; i < indicesApariciones.length; i++) {
                let dias = calcularDiferenciaDias(fechasHoras[indicesApariciones[i-1]].fecha, fechasHoras[indicesApariciones[i]].fecha);
                if (dias > 0) ciclos.push(dias);
            }

            let promedioCiclo = ciclos.length > 0 ? (ciclos.reduce((a, b) => a + b, 0) / ciclos.length) : 0;
            let ultimaAparicion = fechasHoras[indicesApariciones[indicesApariciones.length - 1]];
            let ultimaFechaStr = `${ultimaAparicion.fecha} (${ultimaAparicion.horaStr})`;
            let prediccion = "Neutro";
            if (subidas > bajadas) prediccion = "MAÑANA";
            else if (bajadas > subidas) prediccion = "TARDE";
            let fechaEst = "N/A", diasRetraso = 0;
            let hoy = new Date();
            let hoySinHora = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());

            if (promedioCiclo > 0 && ultimaFechaStr !== "No registrado") {
                let fechaBase = new Date(ultimaAparicion.fecha + 'T00:00:00');
                let fechaEstimadaDate = new Date(fechaBase);
                fechaEstimadaDate.setDate(fechaEstimadaDate.getDate() + Math.round(promedioCiclo));
                fechaEst = fechaEstimadaDate.toISOString().split('T')[0];
                diasRetraso = Math.round((hoySinHora - fechaEstimadaDate) / (1000 * 60 * 60 * 24));
            }

            let numerosVecinos = [];
            indicesApariciones.forEach(idx => {
                if (idx - 1 >= 0) numerosVecinos.push(historialNumeros[idx - 1]);
                if (idx + 1 < historialNumeros.length) numerosVecinos.push(historialNumeros[idx + 1]);
            });
            let conteo = {};
            numerosVecinos.forEach(n => conteo[n] = (conteo[n] || 0) + 1);
            let topAtrayentes = Object.entries(conteo).sort((a, b) => b[1] - a[1]).slice(0, 5).map(e => [parseInt(e[0]), e[1]]);

            return {
                num: numeroObjetivo, subidas, bajadas, ciclo: promedioCiclo.toFixed(1), ultima: ultimaFechaStr,
                prediccion, fecha_estimada: fechaEst, dias_retraso: diasRetraso, top_atrayentes: topAtrayentes
            };
        }

        function generarMultiplesSecuencias(datosLoteria, numeroInicial, cantidadCadenas = 3) {
            let cadenas = [];
            let resInicial = analizarNumeroIndividual(datosLoteria, numeroInicial);
            if (!resInicial || resInicial.top_atrayentes.length === 0) return [[numeroInicial]];
            let opcionesIniciales = resInicial.top_atrayentes.slice(0, cantidadCadenas).map(at => at[0]);
            
            opcionesIniciales.forEach(opcion => {
                let secuencia = [numeroInicial, opcion];
                let actual = opcion;
                while (secuencia.length < 4) {
                    let res = analizarNumeroIndividual(datosLoteria, actual);
                    if (!res || res.top_atrayentes.length === 0) break;
                    let siguiente = null;
                    for (let [numAt, _] of res.top_atrayentes) {
                        if (!secuencia.includes(numAt)) { siguiente = numAt; break; }
                    }
                    if (siguiente === null) break;
                    secuencia.push(siguiente);
                    actual = siguiente;
                }
                cadenas.push(secuencia);
            });
            if (cadenas.length === 0) cadenas.push([numeroInicial]);
            return cadenas;
        }

        function abrirAnalisis(numero, hora) {
            if (numero === '??') return alert("Sorteo sin número registrado.");
            let datos = loteriaActual === 'lotto' ? datosLotto : (loteriaActual === 'gua' ? datosGuacharo : datosMini);
            let numOrig = parseInt(numero);
            numParaHistorial = numero.toString(); 
            let resOrig = analizarNumeroIndividual(datos, numOrig);
            
            if (resOrig.ultima === "No registrado") {
                document.getElementById('modal-ojo-titulo').innerText = `Análisis para [${numOrig}]`;
                document.getElementById('modal-ojo-cuerpo').innerHTML = `<p style="color:#ff5555;">Este número no tiene apariciones registradas en el historial actual.</p>`;
                document.getElementById('btn-ir-analisis').style.display = 'none';
                document.getElementById('modal-ojo').style.display = 'flex';
                return;
            }

            document.getElementById('btn-ir-analisis').style.display = 'block';
            document.getElementById('modal-ojo-titulo').innerText = `Análisis Rápido para [${numOrig}] - ${hora}`;
            
            let html = `<div class="box-modal">
                <b>Número [${numOrig}]:</b><br>
                • Flancos: Subidas (${resOrig.subidas}) | Bajadas (${resOrig.bajadas})<br>
                • Ciclo Promedio: ${resOrig.ciclo} días<br>
                • Última Salida: ${resOrig.ultima}<br>`;
            let colorPred = resOrig.prediccion === "MAÑANA" ? "#00ffcc" : (resOrig.prediccion === "TARDE" ? "#ffcc00" : "#ffffff");
            html += `• Proyección: <span style="color:${colorPred}; font-weight:bold;">${resOrig.prediccion}</span><br>`;
            if (resOrig.fecha_estimada !== "N/A") {
                html += `• Estimado para: ${resOrig.fecha_estimada}`;
                if (resOrig.dias_retraso > 0) html += ` <span style="color:#ff5555;">(Retrasado ${resOrig.dias_retraso} días)</span>`;
                else if (resOrig.dias_retraso === 0) html += ` <span style="color:#ffff00;">(Para hoy)</span>`;
            }
            html += `</div>`;

            let cadenas = generarMultiplesSecuencias(datos, numOrig, 3);
            html += `<div class="box-modal box-cadena">
                <b style="color:#ff00cc; font-size: 16px;">🔗 TRIPLE CADENA DE ATRACCIÓN:</b><br><br>`;
            let colores = ["#00ffcc", "#ffcc00", "#ff6600", "#ff00cc"];
            cadenas.forEach((sec, i) => {
                html += `<b>Ruta ${i+1}:</b> `;
                sec.forEach((n, j) => {
                    html += `<span class="texto-cadena" style="color:${colores[j%4]};">[${n}]</span>`;
                    if (j < sec.length - 1) html += ` <span style="color:#888;">➔</span> `;
                });
                html += `<br>`;
            });
            html += `</div>`;

            document.getElementById('modal-ojo-cuerpo').innerHTML = html;
            document.getElementById('modal-ojo').style.display = 'flex';
        }

        function cerrarModalOjo() {
            document.getElementById('modal-ojo').style.display = 'none';
        }

        function irAHistorialAvanzado() {
            window.location.href = `hist_avanzado.html?numero=${numParaHistorial}`;
        }

        // ==========================================
        // LÓGICA DE PRUEBA TU SUERTE (CON COOKIES)
        // ==========================================
        const TIEMPO_ESPERA_MS = 5 * 60 * 60 * 1000; // 5 horas en milisegundos
        let intervaloCronometro = null;

        function obtenerCookie(nombre) {
            let name = nombre + "=";
            let decodedCookie = decodeURIComponent(document.cookie);
            let ca = decodedCookie.split(';');
            for(let i = 0; i <ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') { c = c.substring(1); }
                if (c.indexOf(name) == 0) { return c.substring(name.length, c.length); }
            }
            return "";
        }

        function verificarSuerteDisponible() {
            let ultimoIntento = parseInt(obtenerCookie("jarvis_suerte_time"));
            let btn = document.getElementById('btn-agregar-manual');
            
            if (ultimoIntento) {
                let ahora = new Date().getTime();
                let tiempoTranscurrido = ahora - ultimoIntento;
                
                if (tiempoTranscurrido < TIEMPO_ESPERA_MS) {
                    // Bloquear botón y empezar cronómetro
                    btn.disabled = true;
                    let tiempoRestante = TIEMPO_ESPERA_MS - tiempoTranscurrido;
                    iniciarCronometro(tiempoRestante, btn);
                    return;
                }
            }
            
            // Si llegó aquí, está disponible
            btn.disabled = false;
            btn.innerHTML = "🍀 Prueba tu Suerte";
            if(intervaloCronometro) clearInterval(intervaloCronometro);
        }

        function iniciarCronometro(msRestantes, btn) {
            if(intervaloCronometro) clearInterval(intervaloCronometro);
            
            function actualizar() {
                if (msRestantes <= 0) {
                    clearInterval(intervaloCronometro);
                    btn.disabled = false;
                    btn.innerHTML = "🍀 Prueba tu Suerte";
                    return;
                }
                
                let horas = Math.floor(msRestantes / (1000 * 60 * 60));
                let minutos = Math.floor((msRestantes % (1000 * 60 * 60)) / (1000 * 60));
                let segundos = Math.floor((msRestantes % (1000 * 60)) / 1000);
                
                let hStr = horas.toString().padStart(2, '0');
                let mStr = minutos.toString().padStart(2, '0');
                let sStr = segundos.toString().padStart(2, '0');
                
                btn.innerHTML = `⏳ Espera ${hStr}:${mStr}:${sStr}`;
                msRestantes -= 1000;
            }
            
            actualizar();
            intervaloCronometro = setInterval(actualizar, 1000);
        }

        function probarSuerte() {
            // 1. Guardar la cookie con la hora actual
            let ahora = new Date().getTime();
            document.cookie = "jarvis_suerte_time=" + ahora + "; max-age=" + (60*60*24*30) + "; path=/";
            
            // 2. Bloquear botón
            verificarSuerteDisponible();

            // 3. Obtener Top 9 Números (Mezcla de Calientes y Atrayentes)
            let datosBase = loteriaActual === 'lotto' ? datosLotto : (loteriaActual === 'gua' ? datosGuacharo : datosMini);
            
            // Calcular "Puntaje de Suerte" para cada número
            let puntajes = {};
            let limiteMax = loteriaActual === 'lotto' ? 36 : (loteriaActual === 'gua' ? 99 : 75);
            
            for(let i=0; i<=limiteMax; i++) {
                let stats = analizarNumeroIndividual(datosBase, i);
                if(stats && stats.ultima !== "No registrado") {
                    // Fórmula de puntaje: Flancos + (Ciclo * 2) + (Dias Retraso * 5)
                    let puntaje = (stats.subidas + stats.bajadas) + (parseFloat(stats.ciclo) * 2) + (stats.dias_retraso * 5);
                    puntajes[i] = puntaje;
                }
            }

            // Ordenar de mayor a menor y tomar el Top 9
            let top9 = Object.entries(puntajes)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 9)
                .map(e => parseInt(e[0]));

            // 4. Elegir 2 números al azar de ese Top 9
            let num1 = top9[Math.floor(Math.random() * top9.length)];
            let num2 = top9[Math.floor(Math.random() * top9.length)];
            
            // Evitar que salgan los mismos 2 números
            while (num1 === num2 && top9.length > 1) {
                num2 = top9[Math.floor(Math.random() * top9.length)];
            }

            // 5. Mostrar Modal
            document.getElementById('bola-1').innerText = num1.toString().padStart(2, '0');
            document.getElementById('bola-2').innerText = num2.toString().padStart(2, '0');
            document.getElementById('modal-suerte').style.display = 'flex';
        }

        function cerrarModalSuerte() {
            document.getElementById('modal-suerte').style.display = 'none';
        }

        window.onload = cargarDatos;
    </script>
