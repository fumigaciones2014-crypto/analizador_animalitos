<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANALIZADOR_JARVIS</title>
    <style>
        /* [AQUÍ VA TU CSS ANTERIOR, LO MANTENGO INTACTO PARA NO ROMPER EL DISEÑO] */
        :root {
            --bg-principal: #1a1a1a; --bg-header: #0f0f0f; --bg-panel: #2a2a2a;
            --bg-tabla: #222222; --text-blanco: #ffffff; --text-amarillo: #ffc107;
            --text-verde: #00ff00; --btn-purpura: #4a148c; --btn-verde-oscuro: #1b5e20;
            --btn-azul-oscuro: #0d47a1; --btn-gris-oscuro: #424242; --btn-amarillo: #f9a825;
            --btn-azul-claro: #29b6f6; --btn-gris: #616161; --btn-verde-footer: #2e7d32;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--text-blanco); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background-color: var(--bg-header); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        .header-title { color: var(--text-amarillo); font-size: 1.2rem; font-weight: bold; flex-grow: 1; text-align: center; letter-spacing: 1px; }
        
        .layout-container { display: grid; grid-template-columns: 1fr 300px; flex-grow: 1; overflow: hidden; }
        
        .sidebar-right { background-color: var(--bg-panel); padding: 15px; display: flex; flex-direction: column; gap: 10px; border-left: 2px solid #333; overflow-y: auto; }
        .sidebar-title { text-align: center; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; color: #ccc; }
        .btn-menu { padding: 15px 10px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; text-align: center; transition: opacity 0.2s; }
        .btn-menu:hover { opacity: 0.8; }
        .bg-purpura { background-color: var(--btn-purpura); } .bg-verde { background-color: var(--btn-verde-oscuro); }
        .bg-azul { background-color: var(--btn-azul-oscuro); } .bg-gris { background-color: var(--btn-gris-oscuro); }
        .bg-amarillo { background-color: var(--btn-amarillo); color: #000; }
        
        main { display: flex; flex-direction: column; padding: 10px; overflow: hidden; }
        .tabs-container { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; cursor: pointer; font-weight: bold; color: white; border-radius: 4px 4px 0 0; }
        .tab-active { background-color: var(--btn-azul-claro); color: #000; } .tab-inactive { background-color: var(--btn-gris); }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; }
        .toolbar select, .toolbar input { padding: 10px; border-radius: 4px; border: none; background-color: var(--btn-gris); color: white; font-weight: bold; }
        .toolbar input { flex-grow: 1; background-color: #ffffff; color: #000; }
        .btn-tool { padding: 10px 20px; border: none; border-radius: 4px; background-color: var(--btn-gris); color: white; font-weight: bold; cursor: pointer; }
        
        .table-container { flex-grow: 1; overflow-y: auto; background-color: var(--bg-tabla); margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background-color: #111; padding: 12px; position: sticky; top: 0; font-size: 0.9rem; }
        td { padding: 10px; border-bottom: 1px solid #333; }
        .num-verde { color: var(--text-verde); font-weight: bold; }
        .btn-ver { padding: 5px 15px; background-color: var(--btn-gris); border: none; border-radius: 4px; color: white; cursor: pointer; }
        
        .btn-add-manual { width: 100%; padding: 15px; background-color: var(--btn-verde-footer); color: white; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; }
        
        footer { background-color: var(--bg-header); padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; border-top: 2px solid #333; }
        footer a { color: var(--btn-azul-claro); text-decoration: none; font-weight: bold; }
        footer a:hover { text-decoration: underline; }

        /* ESTILOS PARA EL MODAL (La ventanita emergente) */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: #1e1e1e; padding: 20px; border: 2px solid var(--btn-azul-claro);
            border-radius: 8px; width: 80%; max-width: 600px; color: #00ffcc; font-family: Consolas, monospace;
            max-height: 80vh; overflow-y: auto;
        }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: white; }
    </style>
</head>
<body>

    <header>
        <div></div>
        <div class="header-title">JARVIS - MULTIANALIZADOR v1.0</div>
        <button id="btn-descargas" class="btn-menu bg-azul" style="padding: 10px 20px;">DESCARGAS WEB</button>
    </header>

    <div class="layout-container">
        <main>
            <div class="tabs-container">
                <button id="tab-lotto" class="tab-btn tab-active" onclick="cambiarLoteria('lotto')">LOTTO ACT</button>
                <button id="tab-guacharo" class="tab-btn tab-inactive" onclick="cambiarLoteria('gua')">GUACHARO</button>
                <button id="tab-guacharito" class="tab-btn tab-inactive" onclick="cambiarLoteria('mini')">GUACHARITO</button>
            </div>

            <div class="toolbar">
                <select id="select-filtro">
                    <option value="hora">Por Hora</option>
                    <option value="bloques">Por Bloques de Horas</option>
                    <option value="vecinos">Por Número y Vecinos</option>
                </select>
                <input type="text" id="input-buscar" placeholder="Buscar Animal o Número...">
                <button id="btn-limpiar" class="btn-tool">LIMPIAR FILTRO</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Animal</th>
                            <th>Num</th>
                            <th>Ver</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo">
                        <!-- Aquí JavaScript inyectará las filas -->
                    </tbody>
                </table>
            </div>
            <button id="btn-agregar-manual" class="btn-add-manual">+ Agregar Sorteo Manual</button>
        </main>

        <aside class="sidebar-right">
            <div class="sidebar-title">MENÚ DE FUNCIONES</div>
            <button id="btn-menu-explosivos" class="btn-menu bg-purpura">Explosivos</button>
            <button id="btn-menu-patrones" class="btn-menu bg-verde">Patrones</button>
            <button id="btn-menu-graficos" class="btn-menu bg-azul">Gráficos</button>
            <button id="btn-menu-proyeccion" class="btn-menu bg-azul">Proyección</button>
            <button id="btn-menu-automatico" class="btn-menu bg-gris">Modo Auto</button>
            <button id="btn-menu-atrasados" class="btn-menu bg-amarillo">Atrasados</button>
            <button id="btn-menu-funcion7" class="btn-menu bg-gris">Función_7</button>
            <button id="btn-menu-funcion8" class="btn-menu bg-gris">Función_8</button>
        </aside>
    </div>

    <footer>
        <div id="footer-reloj">Fecha y Hora Actual</div>
        <a href="https://loteriadehoy.com/animalitos/resultados" target="_blank">RESULTADOS</a>
    </footer>

    <!-- MODAL PARA EL ANÁLISIS (VENTANA EMERGENTE) -->
    <div id="modal-analisis" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <h3 id="modal-titulo" style="color: #ffcc00; margin-bottom: 10px;">Análisis</h3>
            <div id="modal-cuerpo">Cargando datos...</div>
        </div>
    </div>

    <script>
        // Variables globales para guardar los datos cargados
        let datosLotto = [];
        let datosGuacharo = [];
        let datosMini = [];
        let loteriaActual = 'lotto';

        // 1. RELOJ DEL FOOTER
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('footer-reloj').innerText = `📅 ${ahora.toLocaleDateString()} | ⏰ ${ahora.toLocaleTimeString()}`;
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // 2. CARGAR DATOS JSON (Fetch)
        async function cargarDatos() {
            try {
                const [resLotto, resGua, resMini] = await Promise.all([
                    fetch('mapeo_lotto.json').then(r => r.json()),
                    fetch('mapeo_gua.json').then(r => r.json()),
                    fetch('mapeo_mini.json').then(r => r.json())
                ]);
                
                datosLotto = resLotto;
                datosGuacharo = resGua;
                datosMini = resMini;

                // Renderizar la tabla con los datos de Lotto por defecto
                renderizarTabla(datosLotto);
            } catch (error) {
                console.error("Error cargando los JSON:", error);
                alert("Asegúrate de haber subido los archivos JSON a la carpeta 'data' en GitHub.");
            }
        }

        // 3. RENDERIZAR TABLA (Toma los últimos 50 registros para no saturar)
        function renderizarTabla(datos) {
            const tbody = document.getElementById('tabla-cuerpo');
            tbody.innerHTML = '';
            
            // Tomamos los últimos 50 registros (los más recientes) y los invertimos para ver el más nuevo primero
            const datosRecientes = datos.slice(-50).reverse();

            datosRecientes.forEach(registro => {
                const tr = document.createElement('tr');
                // Formatear fecha (YYYY-MM-DD a DD-MM)
                const fechaParts = registro.fecha.split('-');
                const fechaFormateada = `${fechaParts[2]}-${fechaParts[1]}`;
                
                tr.innerHTML = `
                    <td>${fechaFormateada}</td>
                    <td>${registro.hora}</td>
                    <td>${registro.animal || '---'}</td>
                    <td class="num-verde">${registro.numero}</td>
                    <td><button class="btn-ver" onclick="abrirAnalisis('${registro.numero}', '${registro.hora}')">👁️</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. CAMBIAR DE LOTERÍA (Tabs)
        function cambiarLoteria(loteria) {
            loteriaActual = loteria;
            
            // Cambiar colores de los botones
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('tab-inactive');
            });
            document.getElementById(`tab-${loteria === 'gua' ? 'guacharo' : loteria === 'mini' ? 'guacharito' : 'lotto'}`).classList.remove('tab-inactive');
            document.getElementById(`tab-${loteria === 'gua' ? 'guacharo' : loteria === 'mini' ? 'guacharito' : 'lotto'}`).classList.add('tab-active');

            // Cargar datos según pestaña
            if (loteria === 'lotto') renderizarTabla(datosLotto);
            else if (loteria === 'gua') renderizarTabla(datosGuacharo);
            else if (loteria === 'mini') renderizarTabla(datosMini);
        }

        // 5. ABRIR MODAL DE ANÁLISIS (El botón "Ver")
        function abrirAnalisis(numero, hora) {
            if (numero === '??') {
                alert("Este sorteo no tiene número registrado.");
                return;
            }

            const modal = document.getElementById('modal-analisis');
            const titulo = document.getElementById('modal-titulo');
            const cuerpo = document.getElementById('modal-cuerpo');

            titulo.innerText = `Análisis de Flancos para [${numero}] - ${hora}`;
            
            // AQUÍ CONECTAREMOS LA LÓGICA MATEMÁTICA LUEGO
            cuerpo.innerHTML = `
                <p style="color: #fff;">Calculando trayectoria y flancos...</p>
                <p>Número seleccionado: <b>${numero}</b></p>
                <p style="color: #888; font-size: 12px;">(En el siguiente paso, aquí se mostrará la proyección de fecha, ciclo, y la triple cadena de atracción).</p>
            `;

            modal.style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal-analisis').style.display = 'none';
        }

        // Iniciar la carga al abrir la página
        window.onload = cargarDatos;

    </script>
</body>
</html>
