<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Gráficos y Análisis</title>
    <!-- Importamos Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #444; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: #29b6f6; margin: 0; font-size: 1.8rem; text-shadow: 0 0 10px rgba(41,182,246,0.5); }
        .btn-regresar { background-color: #0277bd; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn-regresar:hover { background-color: #0288d1; box-shadow: 0 0 15px rgba(41,182,246,0.4); }
        
        /* Barra de Controles Mejorada */
        .controles { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; flex-wrap: wrap;}
        .controles label { font-weight: bold; color: #ccc; }
        .controles select, .controles input { padding: 10px; border-radius: 5px; border: 1px solid #555; background-color: #333; color: white; font-weight: bold; outline: none; font-size: 16px; }
        
        /* Contenedor del Input con Flechas */
        .input-group { display: flex; align-items: center; background: #333; border-radius: 8px; border: 1px solid #555; overflow: hidden; }
        .input-group input { border: none; background: transparent; text-align: center; width: 70px; font-size: 1.2rem; font-weight: bold; color: #00ffcc; }
        .btn-arrow { background-color: #444; color: white; border: none; padding: 10px 15px; font-size: 1.5rem; cursor: pointer; transition: 0.2s; user-select: none; }
        .btn-arrow:hover { background-color: #0288d1; color: white; }
        .btn-arrow:active { background-color: #01579b; transform: scale(0.95); }
        
        .btn-buscar { background-color: #0288d1; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-buscar:hover { background-color: #03a9f4; box-shadow: 0 0 10px rgba(41,182,246,0.5); }
        
        /* Botón Grafico AUT */
        .btn-aut { background-color: #8e24aa; }
        .btn-aut:hover { background-color: #ab47bc; box-shadow: 0 0 10px rgba(171,71,188,0.5); }

        /* Contenedor del Gráfico */
        .grafico-container { 
            background-color: #1e1e1e; border: 1px solid #444; border-radius: 8px; 
            padding: 20px; flex-grow: 1; position: relative; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 400px;
        }
        
        /* Tabla de Resultados Horarios */
        .tabla-horarios-container {
            width: 100%;
            margin-top: 20px;
            background: #222;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            display: none; /* Oculto por defecto */
        }
        
        .tabla-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .tabla-header h3 { color: #29b6f6; margin: 0; }
        
        .tabla-horarios { width: 100%; border-collapse: collapse; color: #ddd; font-size: 0.9rem; }
        .tabla-horarios th, .tabla-horarios td { padding: 8px; text-align: center; border-bottom: 1px solid #444; }
        .tabla-horarios th { background-color: #333; color: #00ffcc; }
        .tabla-horarios tr:hover { background-color: #333; }

        .loader { display: none; text-align: center; color: #29b6f6; font-size: 1.2rem; margin-top: 50px;}
        .mensaje-vacio { text-align: center; color: #666; font-size: 1.2rem; margin-top: 50px;}

        /* RESPONSIVO PARA MÓVILES */
        @media (max-width: 768px) {
            .header-bar { flex-direction: column; text-align: center; gap: 10px; }
            h1 { font-size: 1.3rem; }
            .btn-regresar { width: 100%; }
            
            .controles { flex-direction: column; align-items: stretch; gap: 10px; }
            .controles select, .controles input, .btn-buscar, .input-group { width: 100%; }
            .input-group { justify-content: space-between; }
            .input-group input { width: 100%; }
            
            .grafico-container { padding: 10px; min-height: 300px; }
            .tabla-header { flex-direction: column; align-items: flex-start; }
            .tabla-horarios th, .tabla-horarios td { padding: 5px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>📉 MAPA CARTESIANO (Gráficos)</h1>
        <a href="index.html" class="btn-regresar">⬅ Regresar al Inicio</a>
    </div>

    <div class="controles">
        <label>Lotería:</label>
        <!-- Se agregó id para detectar cambios y actualizar la tabla si está visible -->
        <select id="combo-loteria" onchange="actualizarTodo()">
            <option value="mapeo_lotto.json">Lotto Activo</option>
            <option value="mapeo_gua.json">Guacharo</option>
            <option value="mapeo_mini.json">Guacharito Millonario</option>
        </select>

        <!-- Selector de Horarios (Filtro superior) -->
        <label>Buscar por Horarios:</label>
        <select id="combo-horario" onchange="mostrarTablaHorarios()">
            <option value="none">-- Seleccionar --</option>
            <option value="17:00">DESPUÉS DE LAS 5PM</option>
            <option value="12:00">DESPUÉS DE LAS 12PM</option>
            <option value="08:00">DESPUÉS DE LAS 8AM</option>
        </select>

        <label>Número:</label>
        <div class="input-group">
            <button class="btn-arrow" onclick="cambiarNumero(-1)">◀</button>
            <input type="number" id="input-numero" value="0" min="0" max="99">
            <button class="btn-arrow" onclick="cambiarNumero(1)">▶</button>
        </div>
        
        <button class="btn-buscar" onclick="dibujarGrafico()">📊 Generar Gráfico</button>
        <button class="btn-buscar btn-aut" onclick="dibujarGrafico()">🤖 GRAFICO AUT</button>
    </div>

    <div class="loader" id="loader">Trazando línea de tiempo...</div>
    
    <div class="grafico-container" id="grafico-container">
        <canvas id="miGrafico"></canvas>
        <p class="mensaje-vacio" id="mensaje-vacio">Ingresa un número para ver su mapa de desplazamiento.</p>
    </div>

    <!-- Contenedor para la tabla de resultados por horario -->
    <div class="tabla-horarios-container" id="tabla-horarios-container">
        <div class="tabla-header">
            <h3>Resultados Recientes (Últimos 15 días)</h3>
            
            <!-- NUEVO MENÚ DE FILTRO DE LA TABLA -->
            <div>
                <label for="filtro-tabla" style="color: #aaa; font-size: 0.9rem; margin-right: 10px;">Filtrar:</label>
                <select id="filtro-tabla" onchange="mostrarTablaHorarios()" style="padding: 5px 10px; border-radius: 5px; background: #333; color: white; border: 1px solid #555;">
                    <option value="todos">Mostrar Todos (Crudo)</option>
                    <option value="19:00">Solo Números 7PM</option>
                    <option value="18:00">Solo Números 6PM</option>
                    <option value="17:00">Solo Números 5PM</option>
                </select>
            </div>
        </div>

        <table class="tabla-horarios" id="tabla-resultados">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Número</th>
                    <th>Apertura (+1 Día)</th> <!-- NUEVA COLUMNA -->
                </tr>
            </thead>
            <tbody>
                <!-- Filas generadas por JS -->
            </tbody>
        </table>
    </div>

    <script>
        let miChart = null; 
        let datosGlobales = []; 

        // Función para actualizar todo al cambiar de lotería
        function actualizarTodo() {
            dibujarGrafico();
            const horaLimite = document.getElementById('combo-horario').value;
            if (horaLimite !== 'none') {
                mostrarTablaHorarios();
            }
        }

        // --- LÓGICA DE FLECHAS ---
        function cambiarNumero(delta) {
            const input = document.getElementById('input-numero');
            let val = parseInt(input.value) || 0;
            val += delta;
            
            if (val > 99) val = 0;
            if (val < 0) val = 99;
            
            input.value = val;
            
            clearTimeout(window.timerGrafico);
            window.timerGrafico = setTimeout(() => {
                dibujarGrafico();
            }, 300);
        }

        // --- FUNCIÓN AUXILIAR PARA PARSEAR FECHAS Y SUMAR DÍAS ---
        function sumarDia(fechaStr) {
            // Asumiendo formato YYYY-MM-DD
            let partes = fechaStr.split('-');
            if (partes.length !== 3) return null;
            
            let anio = parseInt(partes[0]);
            let mes = parseInt(partes[1]) - 1; // Mes en JS es 0-index
            let dia = parseInt(partes[2]);

            let fecha = new Date(anio, mes, dia);
            fecha.setDate(fecha.getDate() + 1);

            let y = fecha.getFullYear();
            let m = String(fecha.getMonth() + 1).padStart(2, '0');
            let d = String(fecha.getDate()).padStart(2, '0');

            return `${y}-${m}-${d}`;
        }

        // --- LÓGICA MATEMÁTICA DEL GRÁFICO ---
        function analizarNumeroIndividual(datosLoteria, numeroObjetivo) {
            let fechasHoras = [];
            
            datosLoteria.forEach(registro => {
                let numStr = (registro.numero || '').toString().trim();
                if (numStr === '??' || isNaN(numStr)) return;
                let num = parseInt(numStr);
                
                if (num === numeroObjetivo) {
                    let horaStr = registro.hora;
                    let horaParts = horaStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                    if(!horaParts) return;
                    let hora = parseInt(horaParts[1]);
                    let minuto = parseInt(horaParts[2]);
                    let ampm = horaParts[3].toUpperCase();
                    if (ampm === 'PM' && hora < 12) hora += 12;
                    if (ampm === 'AM' && hora === 12) hora = 0;
                    let horaDecimal = hora + (minuto / 60);

                    fechasHoras.push({ 
                        fecha: registro.fecha, 
                        horaStr: horaStr, 
                        horaDecimal: horaDecimal 
                    });
                }
            });

            return fechasHoras;
        }

        // --- LÓGICA PRINCIPAL DEL GRÁFICO ---
        async function dibujarGrafico() {
            const inputNum = document.getElementById('input-numero').value.trim();
            const loteriaFile = document.getElementById('combo-loteria').value;
            const loader = document.getElementById('loader');
            const mensajeVacio = document.getElementById('mensaje-vacio');
            const canvas = document.getElementById('miGrafico');

            if (inputNum === '' || isNaN(inputNum)) {
                alert("Por favor, ingresa un número válido.");
                return;
            }

            loader.style.display = 'block';
            mensajeVacio.style.display = 'none';
            canvas.style.display = 'none';

            try {
                if (datosGlobales.length === 0 || datosGlobales.file !== loteriaFile) {
                    const res = await fetch(loteriaFile);
                    const datos = await res.json();
                    datosGlobales = datos;
                    datosGlobales.file = loteriaFile; 
                }

                let numObjetivo = parseInt(inputNum);
                let historial = analizarNumeroIndividual(datosGlobales, numObjetivo);

                loader.style.display = 'none';

                if (historial.length === 0) {
                    mensajeVacio.innerText = `El número ${numObjetivo} no tiene apariciones registradas en esta lotería.`;
                    mensajeVacio.style.display = 'block';
                    if(miChart) { miChart.destroy(); miChart = null; }
                    return;
                }

                let historialReciente = historial.slice(-20);
                let labels = historialReciente.map((h, i) => `${h.fecha} (${h.horaStr})`);
                let dataY = historialReciente.map(h => h.horaDecimal);

                canvas.style.display = 'block';
                let ctx = canvas.getContext('2d');
                
                if (miChart) miChart.destroy();

                miChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: `Trayectoria del número ${numObjetivo.toString().padStart(2,'0')}`,
                            data: dataY,
                            borderColor: '#00ffcc',
                            backgroundColor: 'rgba(0, 255, 204, 0.2)',
                            borderWidth: 3,
                            pointBackgroundColor: '#1e1e1e',
                            pointBorderColor: '#00ffcc',
                            pointBorderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 8,
                            fill: true,
                            tension: 0.3 
                        }]
                    },
                    options: {
                        responsive: true, 
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            y: {
                                min: 8, max: 20, 
                                ticks: {
                                    color: '#ccc',
                                    callback: function(value) {
                                        let h = Math.floor(value);
                                        let m = Math.round((value % 1) * 60);
                                        let ampm = h >= 12 ? 'PM' : 'AM';
                                        if (h > 12) h -= 12;
                                        if (h === 0) h = 12;
                                        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')} ${ampm}`;
                                    }
                                },
                                grid: { color: '#333' }
                            },
                            x: { 
                                ticks: { color: '#ccc', maxRotation: 45, minRotation: 45 }, 
                                grid: { display: false } 
                            }
                        },
                        plugins: {
                            legend: { labels: { color: 'white', font: {size: 14} } },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let val = context.parsed.y;
                                        let h = Math.floor(val);
                                        let m = Math.round((val % 1) * 60);
                                        let ampm = h >= 12 ? 'PM' : 'AM';
                                        if (h > 12) h -= 12;
                                        if (h === 0) h = 12;
                                        return `Salió a las: ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')} ${ampm}`;
                                    }
                                }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                mensajeVacio.innerText = "Error al cargar los datos.";
                mensajeVacio.style.display = 'block';
            }
        }

        // --- LÓGICA DE LA TABLA DE HORARIOS ---
        async function mostrarTablaHorarios() {
            const horaLimiteStr = document.getElementById('combo-horario').value;
            const filtroTabla = document.getElementById('filtro-tabla').value; // Nuevo filtro
            const tablaContainer = document.getElementById('tabla-horarios-container');
            const tbody = document.querySelector('#tabla-resultados tbody');
            const loteriaFile = document.getElementById('combo-loteria').value;

            if (horaLimiteStr === 'none') {
                tablaContainer.style.display = 'none';
                return;
            }

            tablaContainer.style.display = 'block';
            tbody.innerHTML = '<tr><td colspan="4">Cargando datos...</td></tr>';

            try {
                if (datosGlobales.length === 0 || datosGlobales.file !== loteriaFile) {
                    const res = await fetch(loteriaFile);
                    const datos = await res.json();
                    datosGlobales = datos;
                    datosGlobales.file = loteriaFile;
                }

                const horaLimite = parseInt(horaLimiteStr.split(':')[0]);
                const resultadosFiltrados = [];

                // 1. Obtener los últimos 15 días únicos
                let datosOrdenados = [...datosGlobales].sort((a, b) => {
                    if (a.fecha < b.fecha) return 1;
                    if (a.fecha > b.fecha) return -1;
                    return 0;
                });

                let diasContados = 0;
                let fechasPermitidas = new Set();
                
                for (let reg of datosOrdenados) {
                    if (!fechasPermitidas.has(reg.fecha)) {
                        fechasPermitidas.add(reg.fecha);
                        diasContados++;
                    }
                    if (diasContados >= 15) break;
                }

                // 2. Filtrar registros por la hora seleccionada en el menú superior
                datosGlobales.forEach(reg => {
                    if (!fechasPermitidas.has(reg.fecha)) return;

                    let horaStr = reg.hora;
                    let horaParts = horaStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                    if(!horaParts) return;
                    
                    let hora = parseInt(horaParts[1]);
                    let ampm = horaParts[3].toUpperCase();
                    if (ampm === 'PM' && hora < 12) hora += 12;
                    if (ampm === 'AM' && hora === 12) hora = 0;

                    if (hora >= horaLimite) {
                        resultadosFiltrados.push(reg);
                    }
                });

                // 3. Aplicar filtro específico del menú de la tabla (7PM, 6PM, 5PM)
                let resultadosFinales = resultadosFiltrados;
                if (filtroTabla !== 'todos') {
                    resultadosFinales = resultadosFiltrados.filter(reg => {
                        // Extraer hora exacta para comparar con el filtro (ej. "19:00")
                        let horaStr = reg.hora;
                        let horaParts = horaStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                        if(!horaParts) return false;
                        
                        let hora = parseInt(horaParts[1]);
                        let ampm = horaParts[3].toUpperCase();
                        if (ampm === 'PM' && hora < 12) hora += 12;
                        if (ampm === 'AM' && hora === 12) hora = 0;
                        
                        let horaExacta = `${String(hora).padStart(2, '0')}:00`;
                        return horaExacta === filtroTabla;
                    });
                }

                // 4. Ordenar resultados finales
                resultadosFinales.sort((a, b) => {
                    if (a.fecha < b.fecha) return 1;
                    if (a.fecha > b.fecha) return -1;
                    return 0; 
                });

                // 5. Renderizar tabla con la nueva columna de Apertura (+1 Día)
                tbody.innerHTML = '';
                if (resultadosFinales.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No hay números registrados con los filtros seleccionados.</td></tr>';
                } else {
                    resultadosFinales.forEach(reg => {
                        // Lógica para buscar apertura del día siguiente (8am y 9am)
                        let fechaSiguiente = sumarDia(reg.fecha);
                        let aperturaTexto = "No Disponible";

                        if (fechaSiguiente) {
                            // Buscar en los datos globales si existe la fecha siguiente y hora 8am o 9am
                            let registrosApertura = datosGlobales.filter(d => 
                                d.fecha === fechaSiguiente && 
                                (d.hora.includes('08:00 AM') || d.hora.includes('09:00 AM'))
                            );

                            if (registrosApertura.length > 0) {
                                // Si hay varios, los unimos
                                aperturaTexto = registrosApertura.map(r => r.numero).join(' - ');
                            }
                        }

                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${reg.fecha}</td>
                            <td>${reg.hora}</td>
                            <td style="color: #00ffcc; font-weight: bold;">${reg.numero}</td>
                            <td style="color: #ffb74d; font-weight: bold;">${aperturaTexto}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="4">Error al cargar datos.</td></tr>';
            }
        }

        document.getElementById('input-numero').value = 0;
    </script>
</body>
</html>
