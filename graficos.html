<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Gráficos</title>
    <!-- Importamos Chart.js para dibujar el gráfico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #444; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: #29b6f6; margin: 0; font-size: 1.8rem; text-shadow: 0 0 10px rgba(41,182,246,0.5); }
        .btn-regresar { background-color: #0277bd; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn-regresar:hover { background-color: #0288d1; box-shadow: 0 0 15px rgba(41,182,246,0.4); }
        
        .controles { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; flex-wrap: wrap;}
        .controles label { font-weight: bold; color: #ccc; }
        .controles select, .controles input { padding: 10px; border-radius: 5px; border: 1px solid #555; background-color: #333; color: white; font-weight: bold; outline: none; font-size: 16px; }
        .controles input { width: 100px; text-align: center; }
        .btn-buscar { background-color: #0288d1; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-buscar:hover { background-color: #03a9f4; box-shadow: 0 0 10px rgba(41,182,246,0.5); }

        /* Contenedor del Gráfico */
        .grafico-container { 
            background-color: #1e1e1e; border: 1px solid #444; border-radius: 8px; 
            padding: 20px; flex-grow: 1; position: relative; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        .loader { display: none; text-align: center; color: #29b6f6; font-size: 1.2rem; margin-top: 50px;}
        .mensaje-vacio { text-align: center; color: #666; font-size: 1.2rem; margin-top: 50px;}

        /* RESPONSIVO PARA MÓVILES */
        @media (max-width: 768px) {
            .header-bar { flex-direction: column; text-align: center; gap: 10px; }
            h1 { font-size: 1.3rem; }
            .btn-regresar { width: 100%; }
            
            .controles { flex-direction: column; align-items: stretch; }
            .controles select, .controles input, .btn-buscar { width: 100%; }
            
            .grafico-container { padding: 10px; min-height: 300px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>📉 MAPA CARTESIANO (Gráficos)</h1>
        <a href="index.html" class="btn-regresar">⬅ Regresar al Inicio</a>
    </div>

    <div class="controles">
        <label>Lotería:</label>
        <select id="combo-loteria">
            <option value="mapeo_lotto.json">Lotto Activo</option>
            <option value="mapeo_gua.json">Guacharo</option>
            <option value="mapeo_mini.json">Guacharito Millonario</option>
        </select>

        <label>Número a Graficar:</label>
        <input type="number" id="input-numero" placeholder="Ej: 25" min="0" max="99">
        
        <button class="btn-buscar" onclick="dibujarGrafico()">📊 Generar Gráfico</button>
    </div>

    <div class="loader" id="loader">Trazando línea de tiempo...</div>
    
    <div class="grafico-container" id="grafico-container">
        <canvas id="miGrafico"></canvas>
        <p class="mensaje-vacio" id="mensaje-vacio">Ingresa un número para ver su mapa de desplazamiento.</p>
    </div>

    <script>
        let miChart = null; // Variable global para guardar el gráfico

        // --- LÓGICA MATEMÁTICA ---
        function analizarNumeroIndividual(datosLoteria, numeroObjetivo) {
            let fechasHoras = [];
            
            datosLoteria.forEach(registro => {
                let numStr = (registro.numero || '').toString().trim();
                if (numStr === '??' || isNaN(numStr)) return;
                let num = parseInt(numStr);
                
                if (num === numeroObjetivo) {
                    let horaStr = registro.hora;
                    let horaParts = horaStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                    if(!horaParts) return;
                    let hora = parseInt(horaParts[1]);
                    let minuto = parseInt(horaParts[2]);
                    let ampm = horaParts[3].toUpperCase();
                    if (ampm === 'PM' && hora < 12) hora += 12;
                    if (ampm === 'AM' && hora === 12) hora = 0;
                    let horaDecimal = hora + (minuto / 60);

                    fechasHoras.push({ 
                        fecha: registro.fecha, 
                        horaStr: horaStr, 
                        horaDecimal: horaDecimal 
                    });
                }
            });

            return fechasHoras;
        }

        // --- LÓGICA PRINCIPAL ---
        async function dibujarGrafico() {
            const inputNum = document.getElementById('input-numero').value.trim();
            const loteriaFile = document.getElementById('combo-loteria').value;
            const loader = document.getElementById('loader');
            const mensajeVacio = document.getElementById('mensaje-vacio');
            const canvas = document.getElementById('miGrafico');

            if (inputNum === '' || isNaN(inputNum)) {
                alert("Por favor, ingresa un número válido.");
                return;
            }

            loader.style.display = 'block';
            mensajeVacio.style.display = 'none';
            canvas.style.display = 'none';

            try {
                const res = await fetch(loteriaFile);
                const datos = await res.json();
                
                let numObjetivo = parseInt(inputNum);
                let historial = analizarNumeroIndividual(datos, numObjetivo);

                loader.style.display = 'none';

                if (historial.length === 0) {
                    mensajeVacio.innerText = `El número ${numObjetivo} no tiene apariciones registradas en esta lotería.`;
                    mensajeVacio.style.display = 'block';
                    if(miChart) { miChart.destroy(); miChart = null; }
                    return;
                }

                // Tomar las últimas 20 apariciones para no saturar el gráfico
                let historialReciente = historial.slice(-20);

                // Preparar los datos para Chart.js
                let labels = historialReciente.map((h, i) => `${h.fecha} (${h.horaStr})`);
                let dataY = historialReciente.map(h => h.horaDecimal);

                // Configurar Chart.js
                canvas.style.display = 'block';
                let ctx = canvas.getContext('2d');
                
                if (miChart) miChart.destroy();

                miChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: `Trayectoria del número ${numObjetivo.toString().padStart(2,'0')}`,
                            data: dataY,
                            borderColor: '#00ffcc',
                            backgroundColor: 'rgba(0, 255, 204, 0.2)',
                            borderWidth: 3,
                            pointBackgroundColor: '#1e1e1e',
                            pointBorderColor: '#00ffcc',
                            pointBorderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 8,
                            fill: true,
                            tension: 0.3 // Curvatura de la línea
                        }]
                    },
                    options: {
                        responsive: true, 
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            y: {
                                min: 8, max: 20, // Desde las 8 AM hasta las 8 PM
                                ticks: {
                                    color: '#ccc',
                                    callback: function(value) {
                                        // Convertir número decimal (ej. 14.5) a hora (02:30 PM)
                                        let h = Math.floor(value);
                                        let m = Math.round((value % 1) * 60);
                                        let ampm = h >= 12 ? 'PM' : 'AM';
                                        if (h > 12) h -= 12;
                                        if (h === 0) h = 12;
                                        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')} ${ampm}`;
                                    }
                                },
                                grid: { color: '#333' }
                            },
                            x: { 
                                ticks: { color: '#ccc', maxRotation: 45, minRotation: 45 }, 
                                grid: { display: false } 
                            }
                        },
                        plugins: {
                            legend: { labels: { color: 'white', font: {size: 14} } },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let val = context.parsed.y;
                                        let h = Math.floor(val);
                                        let m = Math.round((val % 1) * 60);
                                        let ampm = h >= 12 ? 'PM' : 'AM';
                                        if (h > 12) h -= 12;
                                        if (h === 0) h = 12;
                                        return `Salió a las: ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')} ${ampm}`;
                                    }
                                }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                mensajeVacio.innerText = "Error al cargar los datos.";
                mensajeVacio.style.display = 'block';
            }
        }
    </script>
</body>
</html>
