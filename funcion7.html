<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS - Fractal V4 (Optimizado Memoria)</title>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #444; padding-bottom: 10px; margin-bottom: 10px; flex-shrink: 0; flex-wrap: wrap; gap: 10px;}
        h1 { color: #b0bec5; margin: 0; font-size: 1.4rem; text-shadow: 0 0 10px rgba(176,190,197,0.5); }
        .btn-regresar { background-color: #546e7a; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; text-decoration: none; transition: 0.3s; font-size: 0.9rem;}
        
        .controles { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; background: #222; padding: 10px; border-radius: 8px; border: 1px solid #444; flex-wrap: wrap; flex-shrink: 0;}
        .controles label { font-weight: bold; color: #ccc; font-size: 0.9rem;}
        .controles select, .controles input { padding: 8px; border-radius: 5px; border: 1px solid #555; background-color: #333; color: white; font-weight: bold; outline: none; font-size: 14px; }
        .controles input { width: 120px; text-align: center; }
        
        .btn-buscar { background-color: #455a64; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .btn-secuencia { background-color: #555; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 14px; border: 1px solid #777; }
        .btn-secuencia.activo { background-color: #00c853; border-color: #69f0ae; }
        .btn-reset { background-color: #d32f2f; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .btn-fractal { background-color: #8e24aa; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 14px; margin-left: auto; }

        .canvas-container { display: none; position: relative; justify-content: center; align-items: stretch; gap: 15px; background: #0a0a0a; border: 2px solid #333; border-radius: 12px; padding: 10px; margin: 0 auto; flex-grow: 1; width: 100%; box-sizing: border-box; overflow: hidden;}
        
        .panel-izquierdo { position: relative; z-index: 10; display: flex; flex-direction: column; gap: 10px; width: 280px; flex-shrink: 0; overflow-y: auto;}
        .panel-derecho { position: relative; z-index: 10; display: flex; flex-direction: column; width: 240px; flex-shrink: 0; background: rgba(20, 20, 20, 0.95); border-radius: 8px; border: 1px solid #444; padding: 10px; overflow-y: auto; }
        
        .canvas-wrapper { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; min-height: 300px;}
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; }
        canvas:active { cursor: grabbing; }

        .historial-item { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px dashed #555; }
        .historial-numero { text-align: center; font-size: 1.1rem; font-weight: bold; color: #00ffcc; margin-bottom: 5px; background: #222; border-radius: 5px; }
        .bolitas-grid-historial { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-bottom: 4px; }
        .bolita-mini { width: 25px; height: 25px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-weight: bold; font-size: 0.75rem; position: relative; }
        .bolita-mini.amarilla { background-color: #ffcc00; color: #000; }
        .bolita-mini.verde { background-color: #00ffcc; color: #000; }

        .leyenda-fractal { background: rgba(20, 20, 20, 0.95); padding: 10px; border-radius: 8px; border: 1px solid #444; font-size: 0.8rem; color: #ccc; }
        .leyenda-fractal h4 { margin: 0 0 8px 0; color: #00ffcc; font-size: 0.9rem; border-bottom: 1px solid #333; padding-bottom: 5px;}
        .leyenda-fractal p { margin: 5px 0; }
        .bullet { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

        .panel-recomendados { background: rgba(20, 20, 20, 0.95); padding: 10px; border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; }
        .bolitas-grid { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 50px; margin-bottom: 10px; }
        .bolita-recomendada { display: flex; justify-content: center; align-items: center; border-radius: 50%; background-color: #ffcc00; color: #000; font-weight: bold; border: 2px solid #fff; position: relative; }
        .bolita-inmediata { display: flex; justify-content: center; align-items: center; border-radius: 50%; background-color: #00ffcc; color: #000; font-weight: bold; border: 2px solid #fff; position: relative; }
        .porcentaje { position: absolute; bottom: -16px; font-size: 0.6rem; color: #aaa; white-space: nowrap; }

        .ruleta-container { display: flex; flex-direction: column; gap: 5px; background: #111; padding: 10px; border-radius: 12px; border: 2px solid #333; max-width: 600px; margin: 0 auto; width: 100%; overflow-y: auto; flex-grow: 1;}
        .fila { display: flex; align-items: center; gap: 5px; }
        .fila-label { width: 60px; text-align: right; font-weight: bold; color: #888; font-size: 0.75rem;}
        .casillas-container { display: flex; gap: 3px; flex-grow: 1;}
        .casilla { background-color: #555; color: white; flex: 1; text-align: center; padding: 10px 2px; border-radius: 4px; font-weight: bold; border: 1px solid #333; cursor: pointer; font-size: 0.9rem;}
        .casilla.vacia { background-color: transparent !important; border: 1px dashed #333 !important; pointer-events: none; }
        .num-objetivo { background-color: #ff00cc !important; color: white !important; transform: scale(1.1); border: 2px solid #fff !important; }
        .vecino-unico { background-color: #00ffcc !important; color: #000 !important; }
        .vecino-repetido { background-color: #ffcc00 !important; color: #000 !important; border: 2px solid #fff !important; }
        .grid-guacharo { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; max-width: 100%; margin: 0 auto; }
        .grid-guacharo .casilla { padding: 5px 0; font-size: 0.65rem; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 900px) {
            body { padding: 5px; }
            .header-bar { flex-direction: column; align-items: stretch; text-align: center; gap: 5px;}
            .controles { flex-direction: column; align-items: stretch; gap: 5px;}
            .controles select, .controles input, .btn-buscar, .btn-fractal, .btn-secuencia, .btn-reset { width: 100%; margin-left: 0; margin-top: 5px; font-size: 12px; padding: 6px;}
            .canvas-container { flex-direction: column; padding: 5px; }
            .panel-izquierdo { display: none; }
            .panel-derecho { width: 100%; max-height: 150px; }
            .canvas-wrapper { min-height: 50vh; height: 50vh; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
</head>
<body>

    <div class="header-bar">
        <h1>🎡 RULETA X N° (Optimizado RAM)</h1>
        <a href="index.html" class="btn-regresar">⬅ Regresar</a>
    </div>

    <div class="controles">
        <label>Lotería:</label>
        <select id="combo-loteria" onchange="cambiarVista()">
            <option value="mapeo_lotto.json">Lotto Activo</option>
            <option value="mapeo_gua.json">Guacharo</option>
            <option value="mapeo_mini.json">Guacharito Millonario</option>
        </select>
        <label>Número(s):</label>
        <input type="text" id="input-numero" placeholder="Ej: 26, 33," maxlength="50">
        
        <button class="btn-buscar" onclick="buscarVecinosRuleta()">🔍 Buscar</button>
        <button id="btn-secuencia" class="btn-secuencia" onclick="toggleSecuencia()">🔗 Secuencias OFF</button>
        <button class="btn-reset" onclick="resetSecuencia()">🔄 Reset</button>
        <button class="btn-fractal" onclick="generarMapaFractal()">🌀 Generar Mapa</button>
    </div>

    <div class="ruleta-container" id="ruleta-container"></div>

    <div class="canvas-container" id="canvas-container">
        <div class="panel-izquierdo">
            <div class="leyenda-fractal">
                <h4>Guía del Mapa</h4>
                <p><strong>Estrellas:</strong> Números de la lotería.</p>
                <p><strong style="color:#00ffff;">Mensajeros:</strong> Top 4 rebotando.</p>
                <p><strong style="color:#00ffff;">Lunas:</strong> Top 5-10 orbitando.</p>
            </div>
            <div class="panel-recomendados" id="panel-recomendados" style="display: none;">
                <h4 style="color: #ffcc00; font-size: 0.85rem;">Top 4 Fractal</h4>
                <div class="bolitas-grid" id="bolitas-fractal"></div>
                <h4 style="color: #00ffcc; font-size: 0.85rem;">Vecinos</h4>
                <div class="bolitas-grid" id="bolitas-inmediatas"></div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="fractal-canvas"></canvas>
        </div>

        <div class="panel-derecho" id="panel-historial">
            <h4 style="text-align: center; color: #ffcc00; margin: 0 0 5px 0; font-size: 0.9rem;">Historial</h4>
            <div id="historial-contenido" style="color: #888; text-align: center; font-size: 0.8rem;">Ingresa números.</div>
        </div>
    </div>

    <script>
        const FILAS_RULETA_LOTTO = [
            { id: "fila_1", nums: [12, 35, 3, 26, 0, 32, 15] }, { id: "fila_2", nums: [28, 19] }, { id: "fila_3", nums: [7, 4] }, { id: "fila_4", nums: [29, 21] },
            { id: "fila_5", nums: [18, 2] }, { id: "fila_6", nums: [22, 25] }, { id: "fila_7", nums: [9, 17] }, { id: "fila_8", nums: [31, 34] }, { id: "fila_9", nums: [14, 6] }, { id: "fila_10", nums: [20, 27] },
            { id: "fila_11", nums: [1, 13] }, { id: "fila_12", nums: [33, 36] }, { id: "fila_13", nums: [16, 24, 5, 10, 23, 8, 30, 11] }
        ];

        const MATRIZ_GUACHARO = [
            [48, 24, 7, 33, "00", 50, 4, 34, 17, 28, 9, 47], [64, 57, 38, 6, 49, 18, 56, 13, 27, 46, "", ""],
            [44, 66, "", "", "", "", "", "", "", "", 15, 30], [65, 2, "", "", "", "", "", "", "", "", 39, 21],
            [20, 69, "", "", "", "", "", "", "", "", 41, 72], [25, 52, "", "", "", "", "", "", "", "", 1, 26],
            [70, 16, "", "", "", "", "", "", "", "", 19, 42], [53, 68, "", "", "", "", "", "", "", "", 61, 51],
            [0, 31, "", "", "", "", "", "", "", "", 12, 23], [55, 11, "", "", "", "", "", "", "", "", 37, 73],
            [60, 35, 10, 74, 43, 29, 40, 3, 58, 32, 14, 22], [45, 59, 62, 71, 8, 36, 54, 67, 63, 5, "", ""]
        ];

        let vistaActual = 'lotto';
        let modoSecuenciaActivo = false;
        let temporizadorSecuencia = null;
        let historialSecuencia = []; 
        let animationFrameId = null;
        let panzoomInstance = null;

        let mensajeros = [];
        let limitesRebote = { top: 0, bottom: 0, left: 0, right: 0 };

        window.onload = function() {
            dibujarVistaActual();
            const canvas = document.getElementById('fractal-canvas');
            panzoomInstance = Panzoom(canvas, { maxScale: 5, minScale: 0.5, contain: 'outside', cursor: 'grab' });
            canvas.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
            ajustarCanvasSize();
            window.addEventListener('resize', ajustarCanvasSize);
        };

        function ajustarCanvasSize() {
            const wrapper = document.querySelector('.canvas-wrapper');
            const canvas = document.getElementById('fractal-canvas');
            if(wrapper.clientWidth && wrapper.clientHeight) {
                canvas.width = wrapper.clientWidth;
                canvas.height = wrapper.clientHeight;
            }
        }

        function toggleSecuencia() {
            modoSecuenciaActivo = !modoSecuenciaActivo;
            const btn = document.getElementById('btn-secuencia');
            if (modoSecuenciaActivo) { btn.classList.add('activo'); btn.innerHTML = "✅ Secuencias ON"; } 
            else { btn.classList.remove('activo'); btn.innerHTML = "🔗 Secuencias OFF"; }
        }

        function resetSecuencia() {
            document.getElementById('input-numero').value = '';
            historialSecuencia = []; 
            document.getElementById('canvas-container').style.display = 'none';
            document.getElementById('ruleta-container').style.display = 'flex';
            document.getElementById('panel-historial').innerHTML = '<h4 style="text-align: center; color: #ffcc00; margin: 0 0 5px 0; font-size: 0.9rem;">Historial</h4><div style="color: #888; text-align: center; font-size: 0.8rem;">Ingresa números.</div>';
            if (temporizadorSecuencia) clearTimeout(temporizadorSecuencia);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        document.getElementById('input-numero').addEventListener('input', function(e) {
            if (modoSecuenciaActivo && e.target.value.endsWith(',')) {
                if (temporizadorSecuencia) clearTimeout(temporizadorSecuencia);
                temporizadorSecuencia = setTimeout(() => {
                    if (e.target.value.slice(0, -1).trim() !== '') generarMapaFractal();
                }, 300);
            }
        });

        function cambiarVista() {
            document.getElementById('canvas-container').style.display = 'none';
            document.getElementById('ruleta-container').style.display = 'flex';
            dibujarVistaActual();
        }

        function dibujarVistaActual() {
            const container = document.getElementById('ruleta-container');
            container.innerHTML = '';
            if (vistaActual === 'lotto') {
                FILAS_RULETA_LOTTO.forEach(fila => {
                    let rowDiv = document.createElement('div'); rowDiv.className = 'fila';
                    let casillasDiv = document.createElement('div'); casillasDiv.className = 'casillas-container';
                    fila.nums.forEach(num => {
                        let casilla = document.createElement('div'); casilla.className = 'casilla'; casilla.id = `casilla-${num}`;
                        casilla.innerText = num; casilla.addEventListener('click', () => seleccionarNumeroDesdeRuleta(num));
                        casillasDiv.appendChild(casilla);
                    });
                    rowDiv.appendChild(casillasDiv); container.appendChild(rowDiv);
                });
            } else {
                const grid = document.createElement('div'); grid.className = 'grid-guacharo';
                MATRIZ_GUACHARO.forEach(fila => {
                    fila.forEach(num => {
                        const casilla = document.createElement('div');
                        if (num === "") { casilla.className = 'casilla vacia'; } 
                        else {
                            casilla.className = 'casilla'; casilla.id = `g-casilla-${num}`; casilla.innerText = num;
                            casilla.addEventListener('click', () => seleccionarNumeroDesdeRuleta(num));
                        }
                        grid.appendChild(casilla);
                    });
                });
                container.appendChild(grid);
            }
        }

        function seleccionarNumeroDesdeRuleta(num) {
            document.getElementById('input-numero').value = num + ',';
            generarMapaFractal();
        }

        // ============================================================
        // LÓGICA PRINCIPAL: MAPA, ZOOM Y SATÉLITES (CON OPTIMIZACIÓN DE MEMORIA)
        // ============================================================
        async function generarMapaFractal() {
            const loteriaFile = document.getElementById('combo-loteria').value;
            const canvasContainer = document.getElementById('canvas-container');
            const ruletaContainer = document.getElementById('ruleta-container');
            const inputVal = document.getElementById('input-numero').value.trim();
            
            let inputLimpio = inputVal.replace(/,/g, ' ').trim(); 
            let numerosBusqueda = inputLimpio.split(' ').map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n >= 0 && n <= 99);
            
            if (numerosBusqueda.length === 0) { alert("Ingresa al menos un número."); return; }

            canvasContainer.style.display = 'flex';
            ruletaContainer.style.display = 'none';
            document.getElementById('panel-recomendados').style.display = 'flex';
            
            ajustarCanvasSize(); 
            const canvas = document.getElementById('fractal-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width; const height = canvas.height;
            const centroX = width / 2; const centroY = height / 2;

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            try {
                // 1. CARGAR DATOS CON LÍMITE (Solo los últimos 90 registros)
                const res = await fetch(loteriaFile); 
                const datosCompletos = await res.json(); 
                const datosLimitados = datosCompletos.slice(-90); // <-- OPTIMIZACIÓN CLAVE
                
                let historialDatos = [];
                datosLimitados.forEach(reg => { 
                    if (reg.numero !== '??' && !isNaN(reg.numero) && reg.numero !== '') {
                        historialDatos.push(parseInt(reg.numero)); 
                    }
                });

                const VENTANA = 5;
                const nodos = {}; const aristas = {}; const adyacentes = {}; 
                for(let i=0; i<100; i++) { nodos[i] = { count: 0, x: 0, y: 0, id: i, isPrimary: false }; adyacentes[i] = {}; }

                let maxPrimario = 36; 
                if (loteriaFile.includes('gua')) maxPrimario = 75;
                if (loteriaFile.includes('mini')) maxPrimario = 99;

                historialDatos.forEach((num, index) => {
                    if (nodos[num]) nodos[num].count++;
                    for (let i = 1; i <= VENTANA; i++) {
                        if (index + i < historialDatos.length) {
                            let nextNum = historialDatos[index + i];
                            let key = num < nextNum ? `${num}-${nextNum}` : `${nextNum}-${num}`;
                            aristas[key] = (aristas[key] || 0) + 1;
                            adyacentes[num][nextNum] = (adyacentes[num][nextNum] || 0) + 1;
                            adyacentes[nextNum][num] = (adyacentes[nextNum][num] || 0) + 1;
                        }
                    }
                });

                let recomendadosFractal = []; let recomendadosInmediatos = [];
                let numeroPrincipal = numerosBusqueda[numerosBusqueda.length - 1];

                if (adyacentes[numeroPrincipal]) {
                    let candidatos = [];
                    for (let adj in adyacentes[numeroPrincipal]) {
                        let numAdj = parseInt(adj);
                        let puntaje = (100 - nodos[numAdj].count) + (adyacentes[numeroPrincipal][numAdj] * 5); 
                        candidatos.push({ num: numAdj, puntaje: puntaje });
                    }
                    candidatos.sort((a, b) => b.puntaje - a.puntaje);
                    recomendadosFractal = candidatos.filter(c => c.num <= maxPrimario).slice(0, 4);
                }

                let indicesApariciones = [];
                historialDatos.forEach((h, i) => { if (h === numeroPrincipal) indicesApariciones.push(i); });
                if (indicesApariciones.length > 0) {
                    let ultimas = indicesApariciones.slice(-5).reverse();
                    let conteoVecinos = {};
                    ultimas.forEach(idx => {
                        if (idx - 1 >= 0) { let n = historialDatos[idx - 1]; conteoVecinos[n] = (conteoVecinos[n] || 0) + 1; }
                        if (idx - 2 >= 0) { let n = historialDatos[idx - 2]; conteoVecinos[n] = (conteoVecinos[n] || 0) + 1; }
                        if (idx + 1 < historialDatos.length) { let n = historialDatos[idx + 1]; conteoVecinos[n] = (conteoVecinos[n] || 0) + 1; }
                        if (idx + 2 < historialDatos.length) { let n = historialDatos[idx + 2]; conteoVecinos[n] = (conteoVecinos[n] || 0) + 1; }
                    });
                    let candidatosInmediatos = [];
                    for (let num in conteoVecinos) { candidatosInmediatos.push({ num: parseInt(num), puntaje: conteoVecinos[num] * 10 }); }
                    candidatosInmediatos.sort((a, b) => b.puntaje - a.puntaje);
                    recomendadosInmediatos = candidatosInmediatos.filter(c => c.num <= maxPrimario).slice(0, 4);
                }

                actualizarPanelIzquierdo(numeroPrincipal, recomendadosFractal, recomendadosInmediatos);
                actualizarHistorialYFuerza(numeroPrincipal, recomendadosFractal, recomendadosInmediatos);

                const radioMax = Math.min(width, height) / 2 - 40; 
                const numerosOrdenados = Object.values(nodos).sort((a, b) => a.count - b.count);
                const primarios = numerosOrdenados.filter(n => n.id <= maxPrimario);
                const satelites = numerosOrdenados.filter(n => n.id > maxPrimario);

                const anguloDorado = 137.5 * (Math.PI / 180);
                const radioHueco = 20; 

                primarios.forEach((nodo, index) => {
                    let ratio = index / primarios.length; 
                    let radio = radioHueco + (Math.sqrt(ratio) * (radioMax - radioHueco)); 
                    let angulo = index * anguloDorado; 
                    nodo.x = centroX + Math.cos(angulo) * radio;
                    nodo.y = centroY + Math.sin(angulo) * radio;
                    nodo.size = 15 + (ratio * 15);
                    nodo.isPrimary = true;
                });

                satelites.forEach((nodo) => {
                    let padre = primarios[Math.floor(Math.random() * primarios.length)];
                    nodo.padre = padre;
                    nodo.anguloOrbita = Math.random() * Math.PI * 2;
                    nodo.velocidadOrbita = (Math.random() * 0.02 + 0.01);
                    nodo.distanciaOrbita = padre.size + (Math.random() * 30) + 15;
                    nodo.size = 4 + (Math.random() * 4); 
                });

                // 2. LÓGICA DE MENSAJEROS OPTIMIZADA (Sin cargar 3 JSON completos)
                mensajeros = [];
                
                // Usamos la data limitada que ya tenemos para buscar los satélites conectados
                // Si estamos en Lotto, buscamos números > 36 que sigan al número buscado
                let conteoMensajeros = {};
                historialDatos.forEach((num, idx) => {
                    if (numerosBusqueda.includes(num)) {
                        for(let i=1; i<=3; i++) { // Buscar los 3 siguientes
                            if (idx + i < historialDatos.length) {
                                let numSig = historialDatos[idx+i];
                                if (numSig > maxPrimario) {
                                    conteoMensajeros[numSig] = (conteoMensajeros[numSig] || 0) + (4 - i);
                                }
                            }
                        }
                    }
                });

                let topMensajeros = Object.keys(conteoMensajeros).map(num => {
                    return { id: parseInt(num), fuerza: conteoMensajeros[num] };
                }).sort((a,b) => b.fuerza - a.fuerza).slice(0, 10);

                // Si por falta de datos no hay 10, rellenamos con aleatorios para que el efecto visual no se pierda
                while(topMensajeros.length < 10) {
                    let randomNum = maxPrimario + 1 + Math.floor(Math.random() * (99 - maxPrimario));
                    if(!topMensajeros.some(m => m.id === randomNum)) {
                        topMensajeros.push({ id: randomNum, fuerza: 1 });
                    }
                }

                let planetas = topMensajeros.slice(0, 4);
                let lunas = topMensajeros.slice(4);

                planetas.forEach(m => {
                    mensajeros.push({
                        id: m.id, type: 'planet',
                        x: centroX + (Math.random() - 0.5) * 100,
                        y: centroY + (Math.random() - 0.5) * 100,
                        vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, 
                        size: 35 
                    });
                });

                lunas.forEach((m, index) => {
                    let planetaPadre = planetas[index % planetas.length];
                    mensajeros.push({
                        id: m.id, type: 'moon', padre: planetaPadre,
                        anguloOrbita: Math.random() * Math.PI * 2, velocidadOrbita: (Math.random() * 0.05 + 0.02),
                        distanciaOrbita: 50 + (Math.random() * 20), size: 12
                    });
                });

                limitesRebote.left = 10; limitesRebote.right = width - 10; limitesRebote.top = 10; limitesRebote.bottom = height - 10;

                // 3. BUCLE DE RENDERIZADO CON CONTROL DE FPS
                let lastFrameTime = 0;
                const FPS = 60;
                const frameInterval = 1000 / FPS;

                const dibujarFrame = (timestamp) => {
                    animationFrameId = requestAnimationFrame(dibujarFrame);
                    
                    if (timestamp - lastFrameTime < frameInterval) return;
                    lastFrameTime = timestamp;

                    ctx.clearRect(0, 0, width, height); 
                    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, width, height);

                    // Aristas
                    ctx.lineWidth = 0.5;
                    for (let key in aristas) {
                        let [n1, n2] = key.split('-').map(Number); let weight = aristas[key];
                        if (nodos[n1] && nodos[n2] && nodos[n1].isPrimary && nodos[n2].isPrimary) {
                            let alpha = Math.min(weight / 10, 0.5); 
                            ctx.strokeStyle = (numerosBusqueda.includes(n1) || numerosBusqueda.includes(n2)) ? `rgba(255, 0, 204, ${alpha + 0.2})` : `rgba(0, 255, 204, ${alpha})`; 
                            ctx.lineWidth = (numerosBusqueda.includes(n1) || numerosBusqueda.includes(n2)) ? 1.5 : 0.5;
                            ctx.beginPath(); ctx.moveTo(nodos[n1].x, nodos[n1].y); ctx.lineTo(nodos[n2].x, nodos[n2].y); ctx.stroke();
                        }
                    }

                    // Secuencia
                    if (numerosBusqueda.length > 1) {
                        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                        ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 15;
                        ctx.beginPath();
                        for (let i = 0; i < numerosBusqueda.length; i++) {
                            let num = numerosBusqueda[i];
                            if (nodos[num]) {
                                if (i === 0) ctx.moveTo(nodos[num].x, nodos[num].y);
                                else ctx.lineTo(nodos[num].x, nodos[num].y);
                            }
                        }
                        ctx.stroke(); ctx.shadowBlur = 0; ctx.lineWidth = 1;
                    }

                    // Satélites Base
                    satelites.forEach(nodo => {
                        if (nodo.padre) {
                            nodo.anguloOrbita += nodo.velocidadOrbita;
                            nodo.x = nodo.padre.x + Math.cos(nodo.anguloOrbita) * nodo.distanciaOrbita;
                            nodo.y = nodo.padre.y + Math.sin(nodo.anguloOrbita) * nodo.distanciaOrbita;
                            ctx.beginPath(); ctx.arc(nodo.x, nodo.y, nodo.size, 0, 2 * Math.PI);
                            ctx.fillStyle = `rgba(100, 150, 200, 0.6)`; ctx.strokeStyle = `rgba(150, 200, 255, 0.8)`; ctx.lineWidth = 1;
                            ctx.fill(); ctx.stroke();
                        }
                    });

                    // Estrellas Principales
                    primarios.forEach(nodo => {
                        let isFractal = recomendadosFractal.some(r => r.num === nodo.id);
                        let isInmediato = recomendadosInmediatos.some(r => r.num === nodo.id);
                        let isBusqueda = numerosBusqueda.includes(nodo.id);

                        ctx.beginPath(); ctx.arc(nodo.x, nodo.y, nodo.size, 0, 2 * Math.PI);
                        ctx.shadowBlur = 0;
                        if (isBusqueda) { ctx.fillStyle = `rgba(255, 0, 204, 0.95)`; ctx.strokeStyle = `#fff`; ctx.lineWidth = 3; ctx.shadowColor = '#ff00cc'; ctx.shadowBlur = 15; } 
                        else if (isFractal) { ctx.fillStyle = `#ffcc00`; ctx.strokeStyle = `#fff`; ctx.lineWidth = 2; } 
                        else if (isInmediato) { ctx.fillStyle = `#00ffcc`; ctx.strokeStyle = `#fff`; ctx.lineWidth = 2; } 
                        else { ctx.fillStyle = nodo.count === 0 ? 'rgba(30, 30, 30, 0.8)' : `rgba(50, 50, 50, 0.8)`; ctx.strokeStyle = `rgb(${Math.min(nodo.count * 5, 255)}, 255, ${Math.min(nodo.count * 5, 255)})`; ctx.lineWidth = 2; }
                        ctx.fill(); ctx.stroke();

                        ctx.shadowBlur = 0;
                        ctx.fillStyle = (isFractal || isInmediato || isBusqueda) ? '#000' : '#fff'; 
                        ctx.font = `bold ${Math.max(10, nodo.size * 0.6)}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(nodo.id === 0 ? "00" : nodo.id.toString().padStart(2, '0'), nodo.x, nodo.y);
                    });

                    // Mensajeros (Planetas y Lunas)
                    mensajeros.forEach(m => {
                        if (m.type === 'planet') {
                            m.x += m.vx; m.y += m.vy;
                            if (m.x - m.size < limitesRebote.left) { m.x = limitesRebote.left + m.size; m.vx *= -1; }
                            if (m.x + m.size > limitesRebote.right) { m.x = limitesRebote.right - m.size; m.vx *= -1; }
                            if (m.y - m.size < limitesRebote.top) { m.y = limitesRebote.top + m.size; m.vy *= -1; }
                            if (m.y + m.size > limitesRebote.bottom) { m.y = limitesRebote.bottom - m.size; m.vy *= -1; }

                            // Estela
                            ctx.beginPath();
                            ctx.moveTo(m.x, m.y);
                            ctx.lineTo(m.x - m.vx * 4, m.y - m.vy * 4); 
                            ctx.strokeStyle = `rgba(0, 255, 255, 0.4)`; 
                            ctx.lineWidth = m.size * 1.5; ctx.lineCap = 'round'; ctx.stroke();

                            // Cuerpo
                            ctx.beginPath(); ctx.arc(m.x, m.y, m.size, 0, 2 * Math.PI);
                            let grad = ctx.createRadialGradient(m.x, m.y, m.size*0.2, m.x, m.y, m.size);
                            grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, '#00ffff'); grad.addColorStop(1, 'rgba(0, 200, 200, 0.8)'); 
                            ctx.fillStyle = grad; ctx.strokeStyle = `#ffffff`; ctx.lineWidth = 2;
                            ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 25; 
                            ctx.fill(); ctx.stroke();
                            
                            ctx.shadowBlur = 0; ctx.fillStyle = '#000'; 
                            ctx.font = `bold ${m.size * 0.7}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillText(m.id === 0 ? "00" : m.id.toString().padStart(2, '0'), m.x, m.y);
                        } 
                        else if (m.type === 'moon') {
                            m.anguloOrbita += m.velocidadOrbita;
                            if (m.padre) {
                                m.x = m.padre.x + Math.cos(m.anguloOrbita) * m.distanciaOrbita;
                                m.y = m.padre.y + Math.sin(m.anguloOrbita) * m.distanciaOrbita;

                                ctx.beginPath(); ctx.arc(m.x, m.y, m.size, 0, 2 * Math.PI);
                                let gradM = ctx.createRadialGradient(m.x, m.y, m.size*0.2, m.x, m.y, m.size);
                                gradM.addColorStop(0, '#ffffff'); gradM.addColorStop(0.5, '#00ffff'); gradM.addColorStop(1, 'rgba(0, 200, 200, 0.8)'); 
                                ctx.fillStyle = gradM; ctx.strokeStyle = `#ffffff`; ctx.lineWidth = 1;
                                ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10;
                                ctx.fill(); ctx.stroke();
                                
                                ctx.shadowBlur = 0; ctx.fillStyle = '#000'; 
                                ctx.font = `bold ${m.size * 0.7}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                                ctx.fillText(m.id === 0 ? "00" : m.id.toString().padStart(2, '0'), m.x, m.y);
                            }
                        }
                    });
                };

                dibujarFrame();

            } catch (error) {
                console.error(error); 
                alert("Error al generar el mapa."); 
            }
        }

        function actualizarPanelIzquierdo(numActual, fractales, inmediatos) {
            document.getElementById('titulo-actual').innerText = `Análisis (${numActual.toString().padStart(2, '0')})`;
            const bFractal = document.getElementById('bolitas-fractal'); const bInmediatas = document.getElementById('bolitas-inmediatas');
            bFractal.innerHTML = ''; bInmediatas.innerHTML = '';
            const crearBolitas = (candidatos, contenedor, claseCss) => {
                if (candidatos.length === 0) return;
                let suma = candidatos.reduce((acc, curr) => acc + curr.puntaje, 0);
                candidatos.forEach(rec => {
                    let size = 30 + (((rec.puntaje / suma) * 100 / 100) * 30); 
                    let bolita = document.createElement('div'); bolita.className = claseCss;
                    bolita.style.width = `${size}px`; bolita.style.height = `${size}px`; bolita.style.fontSize = `${size * 0.35}px`;
                    bolita.innerText = rec.num.toString().padStart(2, '0');
                    let span = document.createElement('span'); span.className = 'porcentaje'; span.innerText = `${((rec.puntaje / suma) * 100).toFixed(1)}%`; bolita.appendChild(span);
                    contenedor.appendChild(bolita);
                });
            };
            crearBolitas(fractales, bFractal, 'bolita-recomendada');
            crearBolitas(inmediatos, bInmediatas, 'bolita-inmediata');
        }

        function actualizarHistorialYFuerza(numActual, fractalesActuales, inmediatosActuales) {
            const historialCont = document.getElementById('historial-contenido');
            if (historialSecuencia.length === 0) historialCont.innerHTML = '';
            if (!historialSecuencia.some(h => h.num === numActual)) {
                historialSecuencia.push({ num: numActual, fractales: JSON.parse(JSON.stringify(fractalesActuales)), inmediatos: JSON.parse(JSON.stringify(inmediatosActuales)) });
            }
            historialCont.innerHTML = '';
            historialSecuencia.forEach((item) => {
                const itemDiv = document.createElement('div'); itemDiv.className = 'historial-item';
                let html = `<div class="historial-numero">Base: ${item.num.toString().padStart(2, '0')}</div>`;
                html += `<div class="bolitas-grid-historial">`;
                item.fractales.forEach(f => { html += `<div class="bolita-mini amarilla">${f.num.toString().padStart(2, '0')}</div>`; });
                html += `</div><div class="bolitas-grid-historial">`;
                item.inmediatos.forEach(v => { html += `<div class="bolita-mini verde">${v.num.toString().padStart(2, '0')}</div>`; });
                html += `</div>`;
                itemDiv.innerHTML = html; historialCont.appendChild(itemDiv);
            });
            document.getElementById('panel-historial').scrollTop = document.getElementById('panel-historial').scrollHeight;
        }
    </script>
