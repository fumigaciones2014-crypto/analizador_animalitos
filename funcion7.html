<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS - Espiral Fractal Universal</title>
    <!-- Librería para Zoom y Paneo -->
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #444; padding-bottom: 10px; margin-bottom: 10px; flex-shrink: 0; }
        h1 { color: #b0bec5; margin: 0; font-size: 1.5rem; }
        .btn-regresar { background-color: #546e7a; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; text-decoration: none; }
        
        .controles { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; background: #222; padding: 10px; border-radius: 8px; border: 1px solid #444; flex-wrap: wrap; flex-shrink: 0; z-index: 100;}
        .controles select, .controles input { padding: 8px; border-radius: 5px; border: 1px solid #555; background-color: #333; color: white; font-weight: bold; outline: none; }
        
        .btn-buscar { background-color: #455a64; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-secuencia { background-color: #555; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; border: 1px solid #777; }
        .btn-secuencia.activo { background-color: #00c853; border-color: #69f0ae; box-shadow: 0 0 15px rgba(0, 200, 83, 0.6); }
        .btn-reset { background-color: #d32f2f; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-fractal { background-color: #8e24aa; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-left: auto; box-shadow: 0 0 10px rgba(142, 36, 170, 0.5); }

        /* Contenedor del mapa con zoom */
        .canvas-viewport { display: block; position: relative; width: 100%; flex-grow: 1; background: #050505; border: 2px solid #333; border-radius: 12px; overflow: hidden; margin: 0 auto; cursor: grab; }
        .canvas-viewport:active { cursor: grabbing; }
        .canvas-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        canvas { background: transparent; display: block; }

        /* Paneles flotantes */
        .floating-panel { position: absolute; background: rgba(15, 15, 15, 0.95); border: 1px solid #444; border-radius: 8px; padding: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 50; pointer-events: auto; }
        .panel-izquierdo { top: 10px; left: 10px; width: 250px; max-height: 90%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .panel-derecho { top: 10px; right: 10px; width: 220px; max-height: 90%; overflow-y: auto; }
        .panel-inferior { bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; border-radius: 30px; padding: 5px 15px; border: 1px solid #555; }
        
        .leyenda-fractal { font-size: 0.8rem; color: #ccc; }
        .leyenda-fractal h4 { margin: 0 0 5px 0; color: #00ffcc; font-size: 0.9rem; border-bottom: 1px solid #333; padding-bottom: 3px;}
        .leyenda-fractal p { margin: 4px 0; line-height: 1.2;}
        .bullet { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

        .panel-recomendados { display: flex; flex-direction: column; align-items: center; }
        .panel-recomendados h4 { margin: 0 0 5px 0; color: #ffcc00; font-size: 0.9rem; text-align: center;}
        
        .bolitas-grid { display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; min-height: 40px; margin-bottom: 5px; }
        .bolita-recomendada { display: flex; justify-content: center; align-items: center; border-radius: 50%; background-color: #ffcc00; color: #000; font-weight: bold; border: 1px solid #fff; position: relative; }
        .bolita-inmediata { display: flex; justify-content: center; align-items: center; border-radius: 50%; background-color: #00ffcc; color: #000; font-weight: bold; border: 1px solid #fff; position: relative; }
        
        .grid-top-10 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; justify-items: center; }
        .bolita-prediccion { display: flex; justify-content: center; align-items: center; border-radius: 50%; background-color: #ff0000; color: #fff; font-weight: bold; border: 1px solid #fff; }
        .porcentaje { position: absolute; bottom: -12px; font-size: 0.55rem; color: #aaa; white-space: nowrap; }

        .historial-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #555; }
        .historial-numero { text-align: center; font-size: 0.9rem; font-weight: bold; color: #00ffcc; margin-bottom: 3px; background: #222; border-radius: 3px; }
        .bolitas-grid-historial { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-bottom: 3px; }
        .bolita-mini { width: 22px; height: 22px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-weight: bold; font-size: 0.65rem; position: relative; }
        .bolita-mini.amarilla { background-color: #ffcc00; color: #000; }
        .bolita-mini.verde { background-color: #00ffcc; color: #000; }
        .acierto { border: 2px solid #ff00cc !important; box-shadow: 0 0 8px #ff00cc; transform: scale(1.1); z-index: 10; }

        .btn-zoom { background: #333; color: white; border: 1px solid #666; border-radius: 50%; width: 35px; height: 35px; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        
        .ruleta-container { display: none; flex-direction: column; gap: 8px; background: #111; padding: 20px; border-radius: 12px; border: 2px solid #333; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box;}
        .fila { display: flex; align-items: center; gap: 10px; }
        .fila-label { width: 80px; text-align: right; font-weight: bold; color: #888; font-size: 0.9rem;}
        .casillas-container { display: flex; gap: 5px; flex-grow: 1;}
        .casilla { background-color: #555; color: white; flex: 1; text-align: center; padding: 15px 5px; border-radius: 4px; font-weight: bold; font-size: 1.2rem; border: 1px solid #333; cursor: pointer; }
        .casilla.vacia { background-color: transparent !important; border: 1px dashed #333 !important; color: transparent !important; pointer-events: none; }
        .num-objetivo { background-color: #ff00cc !important; color: white !important; box-shadow: 0 0 15px #ff00cc; transform: scale(1.1); z-index: 10; border: 2px solid #fff !important; }
        .vecino-unico { background-color: #00ffcc !important; color: #000 !important; box-shadow: 0 0 10px #00ffcc; }
        .vecino-repetido { background-color: #ffcc00 !important; color: #000 !important; box-shadow: 0 0 15px #ffcc00; border: 2px solid #fff !important; transform: scale(1.05); z-index: 9; }

        .grid-guacharo { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; width: 100%; max-width: 560px; margin: 0 auto; }
        .grid-guacharo .casilla { padding: 0; font-size: 0.85rem; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 900px) {
            .panel-izquierdo, .panel-derecho { display: none !important; }
            .controles { justify-content: center; }
            .btn-fractal { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🌀 ESPIRAL FRACTAL UNIVERSAL</h1>
        <a href="index.html" class="btn-regresar">⬅ Regresar</a>
    </div>

    <div class="controles">
        <label>Lotería:</label>
        <select id="combo-loteria" onchange="cambiarVista()">
            <option value="TODAS">TODAS (Cruce Global)</option>
            <option value="mapeo_lotto.json">Lotto Activo</option>
            <option value="mapeo_gua.json">Guacharo</option>
            <option value="mapeo_mini.json">Guacharito Millonario</option>
        </select>

        <label>Número(s):</label>
        <input type="text" id="input-numero" placeholder="Ej: 26, 33, 31," maxlength="50">
        
        <button class="btn-buscar" onclick="buscarVecinosRuleta()">🔍 Buscar</button>
        <button id="btn-secuencia" class="btn-secuencia" onclick="toggleSecuencia()">🔗 Secuencias OFF</button>
        <button class="btn-reset" onclick="resetSecuencia()">🔄 Reset</button>
        
        <button class="btn-fractal" onclick="generarMapaFractal()">🌀 Generar Espiral Universal</button>
    </div>

    <!-- Contenedor del mapa con Zoom y Paneo -->
    <div class="canvas-viewport" id="canvas-viewport">
        <div class="canvas-wrapper" id="canvas-wrapper">
            <!-- Aumentamos el tamaño del canvas para que la espiral sea nítida -->
            <canvas id="fractal-canvas" width="1600" height="1600"></canvas>
        </div>
        
        <!-- Paneles flotantes -->
        <div class="floating-panel panel-izquierdo" id="panel-izquierdo" style="display: none;">
            <div class="leyenda-fractal">
                <h4>Guía de Espiral</h4>
                <p><strong>Centro:</strong> Números Fríos (baja frecuencia).</p>
                <p><strong>Borde:</strong> Números Calientes (alta frecuencia).</p>
                <p><span class="bullet" style="background:#ffd700;"></span> Secuencia de búsqueda</p>
                <p><span class="bullet" style="background:#ff00cc;"></span> Objetivo</p>
                <p><span class="bullet" style="background:#ffcc00;"></span> Top Fractal</p>
                <p><span class="bullet" style="background:#00ffcc;"></span> Vecinos</p>
            </div>
            <div class="panel-recomendados" id="panel-recomendados">
                <h4 id="titulo-actual">Análisis</h4>
                <h4 style="color: #ffcc00; font-size: 0.9rem;">Top 4 Fractal</h4>
                <div class="bolitas-grid" id="bolitas-fractal"></div>
                <h4 style="color: #00ffcc; font-size: 0.9rem;">Vecinos Inmediatos</h4>
                <div class="bolitas-grid" id="bolitas-inmediatas"></div>
                <div id="panel-prediccion-container" style="width: 100%; border-top: 1px dashed #555; margin-top: 10px; padding-top: 10px;">
                    <h4 style="color: #ff0000; font-size: 0.9rem;">Potencial de Salida</h4>
                    <div class="grid-top-10" id="bolitas-prediccion"></div>
                </div>
            </div>
        </div>

        <div class="floating-panel panel-derecho" id="panel-derecho" style="display: none;">
            <h4 style="margin: 0 0 10px 0; color: #ffcc00; font-size: 0.9rem; text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px;">Historial</h4>
            <div id="historial-contenido"></div>
        </div>

        <div class="floating-panel panel-inferior">
            <div class="controles-zoom">
                <button class="btn-zoom" onclick="zoomIn()">+</button>
                <button class="btn-zoom" onclick="zoomOut()">-</button>
                <button class="btn-zoom" onclick="resetZoom()" style="font-size: 12px;">⟲</button>
            </div>
        </div>
    </div>

    <div class="ruleta-container" id="ruleta-container"></div>

    <script>
        // Configuración de Ruletas
        const FILAS_RULETA_LOTTO = [
            { id: "fila_1", nums: [12, 35, 3, 26, 0, 32, 15] },
            { id: "fila_2", nums: [28, 19] }, { id: "fila_3", nums: [7, 4] }, { id: "fila_4", nums: [29, 21] },
            { id: "fila_5", nums: [18, 2] }, { id: "fila_6", nums: [22, 25] }, { id: "fila_7", nums: [9, 17] },
            { id: "fila_8", nums: [31, 34] }, { id: "fila_9", nums: [14, 6] }, { id: "fila_10", nums: [20, 27] },
            { id: "fila_11", nums: [1, 13] }, { id: "fila_12", nums: [33, 36] },
            { id: "fila_13", nums: [16, 24, 5, 10, 23, 8, 30, 11] }
        ];

        const MATRIZ_GUACHARO = [
            [48, 24, 7, 33, "00", 50, 4, 34, 17, 28, 9, 47], 
            [64, 57, 38, 6, 49, 18, 56, 13, 27, 46, "", ""],
            [44, 66, "", "", "", "", "", "", "", "", 15, 30], [65, 2, "", "", "", "", "", "", "", "", 39, 21],
            [20, 69, "", "", "", "", "", "", "", "", 41, 72], [25, 52, "", "", "", "", "", "", "", "", 1, 26],
            [70, 16, "", "", "", "", "", "", "", "", 19, 42], [53, 68, "", "", "", "", "", "", "", "", 61, 51],
            [0, 31, "", "", "", "", "", "", "", "", 12, 23], [55, 11, "", "", "", "", "", "", "", "", 37, 73],
            [60, 35, 10, 74, 43, 29, 40, 3, 58, 32, 14, 22], [45, 59, 62, 71, 8, 36, 54, 67, 63, 5, "", ""]
        ];

        // Variables Globales
        let vistaActual = 'todas';
        let datosGlobales = []; 
        let modoSecuenciaActivo = false;
        let temporizadorSecuencia = null;
        let historialSecuencia = []; 
        let panzoomInstance = null;

        // Inicializar Panzoom
        window.onload = function() {
            const element = document.getElementById('canvas-wrapper');
            panzoomInstance = Panzoom(element, {
                maxScale: 5,
                minScale: 0.5,
                contain: 'outside',
                cursor: 'grab'
            });
            
            // Habilitar zoom con rueda de ratón
            element.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
            
            // Estado inicial
            cambiarVista();
        };

        function zoomIn() { panzoomInstance.zoomIn(); }
        function zoomOut() { panzoomInstance.zoomOut(); }
        function resetZoom() { panzoomInstance.reset(); }

        function toggleSecuencia() {
            modoSecuenciaActivo = !modoSecuenciaActivo;
            const btn = document.getElementById('btn-secuencia');
            if (modoSecuenciaActivo) {
                btn.classList.add('activo');
                btn.innerHTML = "✅ Secuencias ON";
            } else {
                btn.classList.remove('activo');
                btn.innerHTML = "🔗 Secuencias OFF";
            }
        }

        function resetSecuencia() {
            document.getElementById('input-numero').value = '';
            historialSecuencia = []; 
            document.getElementById('canvas-viewport').style.display = 'none';
            document.getElementById('ruleta-container').style.display = 'flex';
            document.getElementById('panel-izquierdo').style.display = 'none';
            document.getElementById('panel-derecho').style.display = 'none';
            limpiarResaltados();
            if (temporizadorSecuencia) clearTimeout(temporizadorSecuencia);
        }

        function cambiarVista() {
            const sel = document.getElementById('combo-loteria').value;
            vistaActual = (sel === 'mapeo_lotto.json') ? 'lotto' : (sel === 'TODAS' ? 'todas' : 'guacharo');
            document.getElementById('canvas-viewport').style.display = 'none';
            document.getElementById('ruleta-container').style.display = 'flex';
            datosGlobales = []; 
            dibujarVistaActual();
        }

        function dibujarVistaActual() {
            if (vistaActual === 'lotto') dibujarRuletaLotto();
            else if (vistaActual === 'guacharo') dibujarRuletaGuacharo();
            else document.getElementById('ruleta-container').innerHTML = '<p style="text-align:center; color:#aaa; padding: 50px;">Modo Cruce Global Activado.<br>Ingresa números y presiona "Generar Espiral Universal".</p>';
        }

        function dibujarRuletaLotto() {
            const container = document.getElementById('ruleta-container');
            container.innerHTML = '';
            FILAS_RULETA_LOTTO.forEach(fila => {
                let rowDiv = document.createElement('div'); rowDiv.className = 'fila';
                let labelDiv = document.createElement('div'); labelDiv.className = 'fila-label'; labelDiv.innerText = fila.id;
                rowDiv.appendChild(labelDiv);
                let casillasDiv = document.createElement('div'); casillasDiv.className = 'casillas-container';
                fila.nums.forEach(num => {
                    let casilla = document.createElement('div'); casilla.className = 'casilla'; casilla.id = `casilla-${num}`;
                    casilla.innerText = num; casilla.dataset.numero = num;
                    casilla.addEventListener('click', () => seleccionarNumeroDesdeRuleta(num));
                    casillasDiv.appendChild(casilla);
                });
                rowDiv.appendChild(casillasDiv); container.appendChild(rowDiv);
            });
        }

        function dibujarRuletaGuacharo() {
            const container = document.getElementById('ruleta-container');
            container.innerHTML = '';
            const grid = document.createElement('div'); grid.className = 'grid-guacharo';
            MATRIZ_GUACHARO.forEach(fila => {
                fila.forEach(num => {
                    const casilla = document.createElement('div');
                    if (num === "") { casilla.className = 'casilla vacia'; } 
                    else {
                        casilla.className = 'casilla'; casilla.id = `g-casilla-${num}`; casilla.innerText = num;
                        casilla.dataset.numero = num;
                        casilla.addEventListener('click', () => seleccionarNumeroDesdeRuleta(num));
                    }
                    grid.appendChild(casilla);
                });
            });
            container.appendChild(grid);
        }

        function seleccionarNumeroDesdeRuleta(num) {
            const inputNum = document.getElementById('input-numero');
            inputNum.value = num;
            buscarVecinosRuleta();
        }

        function limpiarResaltados() {
            document.querySelectorAll('.casilla').forEach(c => c.classList.remove('num-objetivo', 'vecino-unico', 'vecino-repetido'));
        }

        async function buscarVecinosRuleta() {
            const inputVal = document.getElementById('input-numero').value.trim();
            if (inputVal === '') { alert("Ingresa un número."); return; }
            let primerNumero = inputVal.split(',')[0].trim();
            if (isNaN(primerNumero)) { alert("Número inválido."); return; }

            document.getElementById('canvas-viewport').style.display = 'none';
            document.getElementById('ruleta-container').style.display = 'flex';
            limpiarResaltados();

            if (vistaActual === 'todas') {
                alert("En modo global no hay ruleta. Presiona 'Generar Espiral Universal'.");
                return;
            }

            // ... (Lógica de búsqueda de vecinos intacta, no es el foco principal ahora)
        }

        // ============================================================
        // LÓGICA DEL MAPA FRACTAL ESPIRAL UNIVERSAL (100 NÚMEROS)
        // ============================================================
        async function generarMapaFractal() {
            const loteriaFile = document.getElementById('combo-loteria').value;
            const viewport = document.getElementById('canvas-viewport');
            const ruletaContainer = document.getElementById('ruleta-container');
            const inputVal = document.getElementById('input-numero').value.trim();
            
            // Permitir generar el mapa sin números (solo para ver el universo)
            let numerosBusqueda = [];
            if (inputVal !== '') {
                let inputLimpio = inputVal.replace(/,\s*$/, '');
                numerosBusqueda = inputLimpio.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n >= 0 && n <= 99);
            }

            viewport.style.display = 'block';
            ruletaContainer.style.display = 'none';
            document.getElementById('panel-izquierdo').style.display = 'flex';
            document.getElementById('panel-derecho').style.display = 'flex';
            
            const canvas = document.getElementById('fractal-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width; const height = canvas.height;
            const centroX = width / 2; const centroY = height / 2;

            try {
                // Cargar TODOS los datos (Modo Universal)
                const archivos = ['mapeo_lotto.json', 'mapeo_gua.json', 'mapeo_mini.json'];
                let datosCombinados = [];
                for (let file of archivos) {
                    const res = await fetch(file);
                    if (res.ok) {
                        const data = await res.json();
                        datosCombinados = datosCombinados.concat(data);
                    }
                }
                datosGlobales = datosCombinados;

                let historialDatos = [];
                datosGlobales.forEach(reg => {
                    if (reg.numero !== '??' && !isNaN(reg.numero) && reg.numero !== '') {
                        historialDatos.push(parseInt(reg.numero));
                    }
                });

                if (historialDatos.length === 0) { throw new Error("No hay datos."); }

                // --- CÁLCULO DE FRECUENCIAS Y CONEXIONES ---
                const VENTANA = 5;
                const nodos = {}; const aristas = {}; const adyacentes = {}; 
                
                // Inicializar los 100 números (0-99)
                for(let i=0; i<100; i++) { nodos[i] = { count: 0, x: 0, y: 0, id: i }; adyacentes[i] = {}; }

                historialDatos.forEach((num, index) => {
                    if (nodos[num]) nodos[num].count++;
                    for (let i = 1; i <= VENTANA; i++) {
                        if (index + i < historialDatos.length) {
                            let nextNum = historialDatos[index + i];
                            let key = num < nextNum ? `${num}-${nextNum}` : `${nextNum}-${num}`;
                            aristas[key] = (aristas[key] || 0) + 1;
                            adyacentes[num][nextNum] = (adyacentes[num][nextNum] || 0) + 1;
                            adyacentes[nextNum][num] = (adyacentes[nextNum][num] || 0) + 1;
                        }
                    }
                });

                // --- CÁLCULO DE RECOMENDADOS (Solo si hay número principal) ---
                let recomendadosFractal = []; let recomendadosInmediatos = [];
                let numeroPrincipal = numerosBusqueda.length > 0 ? numerosBusqueda[numerosBusqueda.length - 1] : null;

                if (numeroPrincipal !== null && adyacentes[numeroPrincipal]) {
                    let candidatos = [];
                    for (let adj in adyacentes[numeroPrincipal]) {
                        let numAdj = parseInt(adj);
                        let fuerza = adyacentes[numeroPrincipal][numAdj];
                        let frecuencia = nodos[numAdj].count;
                        let puntaje = (100 - frecuencia) + (fuerza * 5); 
                        candidatos.push({ num: numAdj, puntaje: puntaje });
                    }
                    candidatos.sort((a, b) => b.puntaje - a.puntaje);
                    recomendadosFractal = candidatos.slice(0, 4);
                }

                // --- DIBUJO DE LA GALAXIA ESPIRAL (100 NODOS) ---
                ctx.clearRect(0, 0, width, height); 
                ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, width, height);

                // Ordenar los 100 nodos por frecuencia (los más fríos primero para el centro)
                const numerosOrdenados = Object.values(nodos).sort((a, b) => a.count - b.count);
                const totalNodos = 100;
                const anguloDorado = 137.5 * (Math.PI / 180);
                const radioMax = Math.min(width, height) / 2 - 100;

                // Asignar posición y tamaño
                numerosOrdenados.forEach((nodo, index) => {
                    // Fórmula de Espiral de Fermat: Radio = c * sqrt(n)
                    let ratio = index / totalNodos; 
                    let radio = Math.sqrt(ratio) * radioMax; 
                    let angulo = index * anguloDorado; 
                    
                    nodo.x = centroX + Math.cos(angulo) * radio;
                    nodo.y = centroY + Math.sin(angulo) * radio;
                    
                    // Tamaño armónico: los fríos son pequeños (10px), los calientes grandes (hasta 45px)
                    let frecuenciaNormalizada = Math.min(nodo.count / 25, 1); // Ajustar el 25 según la data
                    nodo.size = 10 + (frecuenciaNormalizada * 35); 
                });

                // Dibujar Aristas (Líneas de conexión)
                ctx.lineWidth = 0.3;
                for (let key in aristas) {
                    let [n1, n2] = key.split('-').map(Number); 
                    let weight = aristas[key];
                    if (nodos[n1] && nodos[n2]) {
                        let alpha = Math.min(weight / 30, 0.2); 
                        let involucraBusqueda = numerosBusqueda.includes(n1) || numerosBusqueda.includes(n2);
                        
                        if (involucraBusqueda) {
                            ctx.strokeStyle = `rgba(255, 0, 204, ${alpha + 0.3})`; 
                            ctx.lineWidth = 1.5;
                        } else {
                            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.5})`; 
                            ctx.lineWidth = 0.3;
                        }
                        ctx.beginPath(); 
                        ctx.moveTo(nodos[n1].x, nodos[n1].y); 
                        ctx.lineTo(nodos[n2].x, nodos[n2].y); 
                        ctx.stroke();
                    }
                }

                // Dibujar Secuencia de Búsqueda
                if (numerosBusqueda.length > 1) {
                    ctx.strokeStyle = '#ffd700'; 
                    ctx.lineWidth = 6; 
                    ctx.lineCap = 'round'; 
                    ctx.lineJoin = 'round';
                    ctx.shadowColor = '#ffd700'; 
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    for (let i = 0; i < numerosBusqueda.length; i++) {
                        let num = numerosBusqueda[i];
                        if (nodos[num]) {
                            if (i === 0) ctx.moveTo(nodos[num].x, nodos[num].y);
                            else ctx.lineTo(nodos[num].x, nodos[num].y);
                        }
                    }
                    ctx.stroke(); 
                    ctx.shadowBlur = 0; 
                    ctx.lineWidth = 1;
                }

                // Dibujar los 100 Nodos (Esferas)
                numerosOrdenados.forEach(nodo => {
                    let size = nodo.size;
                    let isFractal = recomendadosFractal.some(r => r.num === nodo.id);
                    let isInmediato = recomendadosInmediatos.some(r => r.num === nodo.id);
                    let isBusqueda = numerosBusqueda.includes(nodo.id);

                    ctx.beginPath(); 
                    ctx.arc(nodo.x, nodo.y, size, 0, 2 * Math.PI);
                    
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'transparent';

                    if (isBusqueda) {
                        ctx.fillStyle = `rgba(255, 0, 204, 1)`; 
                        ctx.strokeStyle = `#fff`; 
                        ctx.lineWidth = 3;
                        ctx.shadowColor = '#ff00cc'; ctx.shadowBlur = 20;
                    } else if (isFractal) {
                        ctx.fillStyle = `#ffcc00`; 
                        ctx.strokeStyle = `#fff`; 
                        ctx.lineWidth = 2;
                        ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 10;
                    } else if (isInmediato) {
                        ctx.fillStyle = `#00ffcc`; 
                        ctx.strokeStyle = `#fff`; 
                        ctx.lineWidth = 2;
                        ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 10;
                    } else {
                        // Color degradado según posición: Centro (Azul/Gris) -> Borde (Rojo/Naranja)
                        let ratioPos = Math.sqrt(nodo.x*nodo.x + nodo.y*nodo.y) / radioMax; // 0 a 1
                        if (ratioPos < 0.3) {
                            ctx.fillStyle = `rgba(50, 80, 150, 0.8)`; // Fríos (Centro)
                            ctx.strokeStyle = `rgba(100, 150, 255, 0.5)`;
                        } else if (ratioPos < 0.7) {
                            ctx.fillStyle = `rgba(100, 150, 50, 0.8)`; // Tibios
                            ctx.strokeStyle = `rgba(150, 255, 100, 0.5)`;
                        } else {
                            // Calientes (Borde)
                            let intensidad = Math.min(nodo.count * 10, 255);
                            ctx.fillStyle = `rgba(255, ${Math.max(50, 150 - nodo.count*2)}, 0, 0.9)`; 
                            ctx.strokeStyle = `rgba(255, 200, 0, 0.8)`;
                        }
                        ctx.lineWidth = 1;
                    }
                    
                    ctx.fill(); 
                    ctx.stroke();

                    // Texto del número
                    ctx.shadowBlur = 0; 
                    ctx.fillStyle = (isFractal || isInmediato || isBusqueda) ? '#000' : '#fff'; 
                    ctx.font = `bold ${Math.max(10, size * 0.7)}px Arial`;
                    ctx.textAlign = 'center'; 
                    ctx.textBaseline = 'middle';
                    let textNum = nodo.id === 0 ? "00" : nodo.id.toString().padStart(2, '0');
                    ctx.fillText(textNum, nodo.x, nodo.y);
                });

                // Actualizar paneles flotantes si hay búsqueda
                if (numeroPrincipal !== null) {
                    actualizarPanelIzquierdo(numeroPrincipal, recomendadosFractal, recomendadosInmediatos);
                } else {
                    document.getElementById('titulo-actual').innerText = "Universo Completo";
                    document.getElementById('bolitas-fractal').innerHTML = '<span style="color:#aaa;font-size:0.8rem;">Ingresa un número</span>';
                    document.getElementById('bolitas-inmediatas').innerHTML = '<span style="color:#aaa;font-size:0.8rem;">para analizar</span>';
                }

            } catch (error) {
                console.error(error); 
                alert("Error al generar el mapa. Revisa la consola.");
            }
        }

        function actualizarPanelIzquierdo(numActual, fractales, inmediatos) {
            document.getElementById('titulo-actual').innerText = `Análisis (${numActual.toString().padStart(2, '0')})`;
            
            const bFractal = document.getElementById('bolitas-fractal');
            const bInmediatas = document.getElementById('bolitas-inmediatas');
            bFractal.innerHTML = ''; bInmediatas.innerHTML = '';

            const crearBolitas = (candidatos, contenedor, claseCss) => {
                if (candidatos.length === 0) return;
                candidatos.forEach((rec) => {
                    let size = 35; 
                    let bolita = document.createElement('div');
                    bolita.className = claseCss;
                    bolita.style.width = `${size}px`; bolita.style.height = `${size}px`;
                    bolita.style.fontSize = `12px`;
                    bolita.innerText = rec.num.toString().padStart(2, '0');
                    contenedor.appendChild(bolita);
                });
            };
            crearBolitas(fractales, bFractal, 'bolita-recomendada');
            crearBolitas(inmediatos, bInmediatas, 'bolita-inmediata');
        }
    </script>
</body>
</html>
