<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Proyección</title>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow-y: auto; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #444; padding-bottom: 10px; margin-bottom: 20px; flex-shrink: 0;}
        h1 { color: #29b6f6; margin: 0; font-size: 1.8rem; text-shadow: 0 0 10px rgba(41,182,246,0.5); }
        .btn-regresar { background-color: #0277bd; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn-regresar:hover { background-color: #0288d1; box-shadow: 0 0 15px rgba(41,182,246,0.4); }
        
        .controles { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; flex-wrap: wrap; flex-shrink: 0;}
        .controles label { font-weight: bold; color: #ccc; }
        .controles select, .controles input { padding: 10px; border-radius: 5px; border: 1px solid #555; background-color: #333; color: white; font-weight: bold; outline: none; font-size: 16px; }
        .controles input { width: 100px; text-align: center; }
        .btn-buscar { background-color: #0288d1; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-buscar:hover { background-color: #03a9f4; box-shadow: 0 0 10px rgba(41,182,246,0.5); }

        .panel-resultados { display: flex; flex-direction: column; gap: 20px; max-width: 900px; margin: 0 auto; width: 100%;}
        .loader { display: none; text-align: center; color: #29b6f6; font-size: 1.2rem; margin-top: 50px; width: 100%;}
        
        /* Tarjeta Principal de Proyección */
        .card-proyeccion { 
            background: linear-gradient(145deg, #0d2a3f, #1a1a1a);
            border: 1px solid #29b6f6; border-radius: 12px; padding: 25px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); text-align: center;
        }
        .proy-header { font-size: 1.2rem; color: #81d4fa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;}
        .proy-numero { font-size: 4rem; font-weight: bold; color: #fff; text-shadow: 0 0 20px #29b6f6; line-height: 1; margin-bottom: 5px;}
        .proy-animal { font-size: 1.5rem; color: #ffcc00; margin-bottom: 20px; font-weight: bold; text-transform: uppercase;}
        
        .proy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px;}
        .proy-item { font-size: 1rem; color: #ccc; }
        .proy-item span { display: block; font-size: 1.2rem; font-weight: bold; color: #fff; margin-top: 3px;}
        
        .proy-prediccion { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 1.3rem; font-weight: bold; }
        .pred-manana { background-color: rgba(0, 255, 204, 0.15); color: #00ffcc; border: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.3);}
        .pred-tarde { background-color: rgba(255, 204, 0, 0.15); color: #ffcc00; border: 1px solid #ffcc00; box-shadow: 0 0 15px rgba(255,204,0,0.3);}
        .pred-neutro { background-color: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid #fff;}

        /* Tarjeta de Cadena */
        .card-cadena { background: #2a1133; border-left: 6px solid #ff00cc; border-radius: 8px; padding: 20px; }
        .cadena-titulo { color: #ff00cc; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; text-align: center;}
        .ruta { margin-bottom: 10px; font-size: 1.2rem; text-align: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px;}
        .ruta b { color: #888; margin-right: 10px; font-size: 0.9rem; text-transform: uppercase;}
        .num-sec { font-weight: bold; font-size: 1.4rem; margin: 0 5px;}

        /* NUEVA: Tarjeta de Radar de Atracción con Animación */
        .card-radar {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-height: 350px; /* Altura mínima para el canvas */
        }
        .radar-titulo {
            color: #b0bec5;
            font-size: 1rem;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            width: 100%;
        }
        #radar-canvas {
            width: 100%;
            height: 300px; /* Altura fija para el canvas */
            display: block;
        }
        .leyenda-radar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #aaa;
        }
        .leyenda-radar span { display: flex; align-items: center; gap: 5px; }
        .bullet-radar { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        /* RESPONSIVO PARA MÓVILES */
        @media (max-width: 768px) {
            .header-bar { flex-direction: column; text-align: center; gap: 10px; }
            h1 { font-size: 1.3rem; }
            .btn-regresar { width: 100%; }
            
            .controles { flex-direction: column; align-items: stretch; }
            .controles select, .controles input, .btn-buscar { width: 100%; }
            
            .proy-grid { grid-template-columns: 1fr; }
            .proy-numero { font-size: 3rem; }
            .num-sec { font-size: 1.1rem; }
            
            .card-radar { min-height: 280px; padding: 10px; }
            #radar-canvas { height: 220px; }
            .leyenda-radar { flex-direction: column; align-items: center; gap: 5px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>📈 PROYECCIÓN INDIVIDUAL</h1>
        <a href="index.html" class="btn-regresar">⬅ Regresar al Inicio</a>
    </div>

    <div class="controles">
        <label>Lotería:</label>
        <select id="combo-loteria">
            <option value="mapeo_lotto.json">Lotto Activo</option>
            <option value="mapeo_gua.json">Guacharo</option>
            <option value="mapeo_mini.json">Guacharito Millonario</option>
        </select>

        <label>Ingrese el Número:</label>
        <input type="number" id="input-numero" placeholder="Ej: 25" min="0" max="99">
        
        <button class="btn-buscar" onclick="ejecutarProyeccion()">🔮 Proyectar Número</button>
    </div>

    <div class="loader" id="loader">Calculando vectores y trayectorias...</div>
    
    <div class="panel-resultados" id="panel-resultados">
        <p style="text-align: center; color: #666; margin-top: 50px;">Ingresa un número y presiona "Proyectar".</p>
    </div>

    <script>
        // --- LÓGICA MATEMÁTICA BASE ---
        function voltearNumero(num) {
            let s = num.toString();
            if (s.length === 1) return num;
            return parseInt(s.split('').reverse().join('')) || 0;
        }

        function calcularDiferenciaDias(fecha1, fecha2) {
            const f1 = new Date(fecha1 + 'T00:00:00');
            const f2 = new Date(fecha2 + 'T00:00:00');
            return Math.round((f2 - f1) / (1000 * 60 * 60 * 24));
        }

        function analizarNumeroIndividual(datosLoteria, numeroObjetivo) {
            let historialNumeros = [], fechasHoras = [];
            let mapaAnimales = {};
            
            datosLoteria.forEach(registro => {
                let numStr = (registro.numero || '').toString().trim();
                if (numStr === '??' || isNaN(numStr)) return;
                let num = parseInt(numStr);
                let horaStr = registro.hora;
                
                let horaParts = horaStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                if(!horaParts) return;
                let hora = parseInt(horaParts[1]);
                let minuto = parseInt(horaParts[2]);
                let ampm = horaParts[3].toUpperCase();
                if (ampm === 'PM' && hora < 12) hora += 12;
                if (ampm === 'AM' && hora === 12) hora = 0;
                let horaDecimal = hora + (minuto / 60);

                historialNumeros.push(num);
                fechasHoras.push({ fecha: registro.fecha, horaStr: horaStr, num: num, decimal: horaDecimal });
                if (registro.animal) mapaAnimales[num] = registro.animal;
            });

            if (historialNumeros.length === 0) return null;
            let indicesApariciones = [];
            historialNumeros.forEach((n, i) => { if (n === numeroObjetivo) indicesApariciones.push(i); });
            if (indicesApariciones.length === 0) return null;

            let subidas = 0, bajadas = 0;
            indicesApariciones.forEach(idx => {
                if (idx > 0) {
                    if (historialNumeros[idx] > historialNumeros[idx-1]) subidas++;
                    else if (historialNumeros[idx] < historialNumeros[idx-1]) bajadas++;
                }
            });

            let ciclos = [];
            for (let i = 1; i < indicesApariciones.length; i++) {
                let dias = calcularDiferenciaDias(fechasHoras[indicesApariciones[i-1]].fecha, fechasHoras[indicesApariciones[i]].fecha);
                if (dias > 0) ciclos.push(dias);
            }

            let promedioCiclo = ciclos.length > 0 ? (ciclos.reduce((a, b) => a + b, 0) / ciclos.length) : 0;
            let ultimaAparicion = fechasHoras[indicesApariciones[indicesApariciones.length - 1]];
            let ultimaFechaStr = `${ultimaAparicion.fecha} (${ultimaAparicion.horaStr})`;

            let prediccion = "NEUTRO";
            if (subidas > bajadas) prediccion = "MAÑANA";
            else if (bajadas > subidas) prediccion = "TARDE";

            let fechaEst = "N/A", diasRetraso = 0;
            let hoy = new Date();
            let hoySinHora = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());

            if (promedioCiclo > 0) {
                let fechaBase = new Date(ultimaAparicion.fecha + 'T00:00:00');
                let fechaEstimadaDate = new Date(fechaBase);
                fechaEstimadaDate.setDate(fechaEstimadaDate.getDate() + Math.round(promedioCiclo));
                fechaEst = fechaEstimadaDate.toISOString().split('T')[0];
                diasRetraso = Math.round((hoySinHora - fechaEstimadaDate) / (1000 * 60 * 60 * 24));
            }

            // Atrayentes
            let numerosVecinos = [];
            indicesApariciones.forEach(idx => {
                if (idx - 1 >= 0) numerosVecinos.push(historialNumeros[idx - 1]);
                if (idx + 1 < historialNumeros.length) numerosVecinos.push(historialNumeros[idx + 1]);
            });
            let conteo = {};
            numerosVecinos.forEach(n => conteo[n] = (conteo[n] || 0) + 1);
            let topAtrayentes = Object.entries(conteo).sort((a, b) => b[1] - a[1]).slice(0, 5).map(e => [parseInt(e[0]), e[1]]);

            return {
                num: numeroObjetivo, subidas, bajadas, ciclo: promedioCiclo.toFixed(1), ultima: ultimaFechaStr,
                prediccion, fecha_estimada: fechaEst, dias_retraso: diasRetraso, top_atrayentes: topAtrayentes,
                animal: mapaAnimales[numeroObjetivo] || '---'
            };
        }

        function generarMultiplesSecuencias(datosLoteria, numeroInicial, cantidadCadenas = 3) {
            let cadenas = [];
            let resInicial = analizarNumeroIndividual(datosLoteria, numeroInicial);
            if (!resInicial || resInicial.top_atrayentes.length === 0) return [[numeroInicial]];
            let opcionesIniciales = resInicial.top_atrayentes.slice(0, cantidadCadenas).map(at => at[0]);
            
            opcionesIniciales.forEach(opcion => {
                let secuencia = [numeroInicial, opcion];
                let actual = opcion;
                while (secuencia.length < 4) {
                    let res = analizarNumeroIndividual(datosLoteria, actual);
                    if (!res || res.top_atrayentes.length === 0) break;
                    let siguiente = null;
                    for (let [numAt, _] of res.top_atrayentes) {
                        if (!secuencia.includes(numAt)) { siguiente = numAt; break; }
                    }
                    if (siguiente === null) break;
                    secuencia.push(siguiente);
                    actual = siguiente;
                }
                cadenas.push(secuencia);
            });
            if (cadenas.length === 0) cadenas.push([numeroInicial]);
            return cadenas;
        }

        // --- NUEVA LÓGICA PARA EL RADAR ORBITAL ---
        function calcularRadarRapido(datosLoteria, numeroObjetivo) {
            const VENTANA = 5;
            const nodos = {}; 
            const adyacentes = {}; 

            for(let i=0; i<100; i++) {
                nodos[i] = { count: 0, id: i };
                adyacentes[i] = {}; 
            }

            let historial = [];
            datosLoteria.forEach(reg => {
                if (reg.numero !== '??' && !isNaN(reg.numero) && reg.numero !== '') {
                    historial.push(parseInt(reg.numero));
                }
            });

            historial.forEach((num, index) => {
                if (nodos[num]) nodos[num].count++;
                for (let i = 1; i <= VENTANA; i++) {
                    if (index + i < historial.length) {
                        let nextNum = historial[index + i];
                        adyacentes[num][nextNum] = (adyacentes[num][nextNum] || 0) + 1;
                        adyacentes[nextNum][num] = (adyacentes[nextNum][num] || 0) + 1;
                    }
                }
            });

            let recomendadosFractal = [];
            if (numeroObjetivo !== null && adyacentes[numeroObjetivo]) {
                let candidatos = [];
                for (let adj in adyacentes[numeroObjetivo]) {
                    let numAdj = parseInt(adj);
                    let fuerzaConexion = adyacentes[numeroObjetivo][numAdj];
                    let frecuenciaPropia = nodos[numAdj].count;
                    let puntajeFrio = 100 - frecuenciaPropia; 
                    let puntaje = puntajeFrio + (fuerzaConexion * 5); 
                    candidatos.push({ num: numAdj, puntaje: puntaje });
                }
                candidatos.sort((a, b) => b.puntaje - a.puntaje);
                recomendadosFractal = candidatos.slice(0, 4);
            }

            let recomendadosInmediatos = [];
            let indicesApariciones = [];
            historial.forEach((h, i) => { if (h === numeroObjetivo) indicesApariciones.push(i); });
            
            if (indicesApariciones.length > 0) {
                let ultimas = indicesApariciones.slice(-5).reverse();
                let conteoVecinos = {};
                ultimas.forEach(idx => {
                    if (idx - 1 >= 0) { let n = historial[idx - 1]; conteoVecinos[n] = (conteoVecinos[n] || 0) + 1; }
                    if (idx - 2 >= 0) { let n = historial[idx - 2]; conteoVecinos[n] = (conteoVecinos[n] || 0) + 1; }
                    if (idx + 1 < historial.length) { let n = historial[idx + 1]; conteoVecinos[n] = (conteoVecinos[n] || 0) + 1; }
                    if (idx + 2 < historial.length) { let n = historial[idx + 2]; conteoVecinos[n] = (conteoVecinos[n] || 0) + 1; }
                });

                let candidatosInmediatos = [];
                for (let num in conteoVecinos) {
                    let count = conteoVecinos[num];
                    let puntaje = count * 10; 
                    candidatosInmediatos.push({ num: parseInt(num), puntaje: puntaje });
                }
                candidatosInmediatos.sort((a, b) => b.puntaje - a.puntaje);
                recomendadosInmediatos = candidatosInmediatos.slice(0, 4);
            }

            return { fractal: recomendadosFractal, inmediatos: recomendadosInmediatos };
        }

        // --- LÓGICA PRINCIPAL ---
        async function ejecutarProyeccion() {
            const loader = document.getElementById('loader');
            const panel = document.getElementById('panel-resultados');
            const inputNum = document.getElementById('input-numero').value.trim();
            const loteriaFile = document.getElementById('combo-loteria').value;

            if (inputNum === '' || isNaN(inputNum)) {
                alert("Por favor, ingresa un número válido.");
                return;
            }

            loader.style.display = 'block';
            panel.innerHTML = '';

            try {
                const res = await fetch(loteriaFile);
                const datos = await res.json();
                
                let numOrig = parseInt(inputNum);
                let resOrig = analizarNumeroIndividual(datos, numOrig);

                loader.style.display = 'none';

                if (!resOrig || resOrig.ultima === "No registrado") {
                    panel.innerHTML = `<div style="text-align: center; color: #ff5555; margin-top: 30px; font-size: 1.2rem;">El número ${numOrig} no tiene apariciones registradas en esta lotería.</div>`;
                    return;
                }

                // 1. Tarjeta Principal
                let clasePred = resOrig.prediccion === "MAÑANA" ? "pred-manana" : (resOrig.prediccion === "TARDE" ? "pred-tarde" : "pred-neutro");
                let emojiPred = resOrig.prediccion === "MAÑANA" ? "🌅" : (resOrig.prediccion === "TARDE" ? "🌇" : "⏸️");

                let html = `
                    <div class="card-proyeccion">
                        <div class="proy-header">Proyección para el número</div>
                        <div class="proy-numero">${numOrig.toString().padStart(2, '0')}</div>
                        <div class="proy-animal">${resOrig.animal}</div>
                        
                        <div class="proy-grid">
                            <div class="proy-item">Última Salida <span>${resOrig.ultima}</span></div>
                            <div class="proy-item">Ciclo Promedio <span>${resOrig.ciclo} días</span></div>
                            <div class="proy-item">Flancos (Sub/Baj) <span><span style="color:#00ffcc">${resOrig.subidas}</span> / <span style="color:#ff5555">${resOrig.bajadas}</span></span></div>
                            <div class="proy-item">Fecha Estimada <span>${resOrig.fecha_estimada}</span></div>
                        </div>

                        <div class="proy-prediccion ${clasePred}">
                            ${emojiPred} PREDICCIÓN: ${resOrig.prediccion}
                        </div>
                    </div>
                `;

                // 2. Tarjeta de Cadena
                let cadenas = generarMultiplesSecuencias(datos, numOrig, 3);
                html += `
                    <div class="card-cadena">
                        <div class="cadena-titulo">🔗 TRIPLE CADENA DE ATRACCIÓN</div>
                `;
                
                let colores = ["#00ffcc", "#ffcc00", "#ff6600", "#ff00cc"];
                cadenas.forEach((sec, i) => {
                    html += `<div class="ruta"><b>Ruta ${i+1}</b> `;
                    sec.forEach((n, j) => {
                        html += `<span class="num-sec" style="color:${colores[j%4]};">[${n.toString().padStart(2,'0')}]</span>`;
                        if (j < sec.length - 1) html += ` <span style="color:#888; font-size:1rem;">➔</span> `;
                    });
                    html += `</div>`;
                });
                html += `</div>`;

                // 3. Nueva Tarjeta de Radar Orbital
                let radarResultados = calcularRadarRapido(datos, numOrig);
                html += `
                    <div class="card-radar">
                        <div class="radar-titulo">🎯 Radar de Atracción Rápida (Ruleta X N°)</div>
                        <canvas id="radar-canvas"></canvas>
                        <div class="leyenda-radar">
                            <span><span class="bullet-radar" style="background:#ffcc00;"></span> Top 4 Fractal</span>
                            <span><span class="bullet-radar" style="background:#00ffcc;"></span> Vecinos Inmediatos</span>
                        </div>
                    </div>
                `;

                panel.innerHTML = html;

                // Iniciar la animación del radar después de que el HTML esté en el DOM
                if (radarResultados.fractal.length > 0 || radarResultados.inmediatos.length > 0) {
                    iniciarAnimacionRadar(radarResultados);
                }

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                panel.innerHTML = `<p style="color:#ff5555; text-align:center;">Error al cargar los datos.</p>`;
            }
        }

        // --- ANIMACIÓN DEL RADAR ORBITAL ---
        let radarAnimationId = null;

        function iniciarAnimacionRadar(radarData) {
            const canvas = document.getElementById('radar-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let width = canvas.clientWidth;
            let height = canvas.clientHeight;

            // Ajustar resolución para pantallas de alta densidad
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            // Cancelar animación previa si existe
            if (radarAnimationId) cancelAnimationFrame(radarAnimationId);

            // Combinar todos los candidatos en un solo array para orbitar
            // El de mayor puntaje (primero de fractal o inmediato) será el planeta central
            let todosCandidatos = [];
            
            // Unir y marcar tipo
            radarData.fractal.forEach(c => todosCandidatos.push({ ...c, tipo: 'fractal', color: '#ffcc00' }));
            radarData.inmediatos.forEach(c => todosCandidatos.push({ ...c, tipo: 'inmediato', color: '#00ffcc' }));

            if (todosCandidatos.length === 0) return;

            // Ordenar por puntaje descendente para identificar el planeta central
            todosCandidatos.sort((a, b) => b.puntaje - a.puntaje);

            const planetaCentral = todosCandidatos[0];
            const lunas = todosCandidatos.slice(1);

            // Configuración de la elipse
            const centroX = width / 2;
            const centroY = height / 2;
            // El radio de la elipse se ajusta para no salir de la pantalla
            const radioX = Math.min(width * 0.35, 140); 
            const radioY = Math.min(height * 0.25, 90);
            
            // Ángulos iniciales aleatorios para las lunas
            lunas.forEach((luna, index) => {
                luna.angulo = (index / lunas.length) * Math.PI * 2;
                // Velocidad relativa: más lejos = más lento
                luna.velocidad = 0.015 + (Math.random() * 0.005); 
                // Tamaño basado en puntaje (escala relativa)
                luna.size = 12 + (luna.puntaje / 100) * 8; 
            });

            // Tamaño del planeta central
            const tamañoPlaneta = 40;

            function dibujar() {
                ctx.clearRect(0, 0, width, height);

                // Fondo sutil
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(0, 0, width, height);

                // Dibujar la órbita (elipse)
                ctx.beginPath();
                ctx.ellipse(centroX, centroY, radioX, radioY, 0, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]); // Resetear

                // 1. Dibujar lunas que están DETRÁS del planeta
                // Una luna está detrás si su ángulo está entre PI y 2*PI (parte inferior de la elipse)
                lunas.forEach(luna => {
                    let x = centroX + Math.cos(luna.angulo) * radioX;
                    let y = centroY + Math.sin(luna.angulo) * radioY;
                    
                    // Si el seno es negativo, está en la parte superior (detrás en perspectiva)
                    if (Math.sin(luna.angulo) < 0) {
                        dibujarLuna(ctx, x, y, luna, false);
                    }
                });

                // 2. Dibujar el Planeta Central (siempre al frente de las lunas traseras)
                ctx.beginPath();
                ctx.arc(centroX, centroY, tamañoPlaneta, 0, Math.PI * 2);
                
                let grad = ctx.createRadialGradient(centroX - 10, centroY - 10, 10, centroX, centroY, tamañoPlaneta);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, '#ffcc00');
                grad.addColorStop(1, '#ff8800');
                
                ctx.fillStyle = grad;
                ctx.shadowColor = '#ffcc00';
                ctx.shadowBlur = 30;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Borde del planeta
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Texto del planeta
                ctx.fillStyle = '#000';
                ctx.font = `bold ${tamañoPlaneta * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(planetaCentral.num.toString().padStart(2, '0'), centroX, centroY);

                // 3. Dibujar lunas que están DELANTE del planeta
                // Si el seno es positivo, está en la parte inferior (delante en perspectiva)
                lunas.forEach(luna => {
                    let x = centroX + Math.cos(luna.angulo) * radioX;
                    let y = centroY + Math.sin(luna.angulo) * radioY;
                    
                    if (Math.sin(luna.angulo) >= 0) {
                        dibujarLuna(ctx, x, y, luna, true);
                    }
                });

                // Actualizar ángulos
                lunas.forEach(luna => {
                    luna.angulo += luna.velocidad;
                });

                radarAnimationId = requestAnimationFrame(dibujar);
            }

            function dibujarLuna(ctx, x, y, luna, alFrente) {
                ctx.beginPath();
                ctx.arc(x, y, luna.size, 0, Math.PI * 2);
                
                // Color basado en tipo
                let colorBase = luna.color;
                let grad = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, luna.size);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.6, colorBase);
                grad.addColorStop(1, 'rgba(0,0,0,0.8)');
                
                ctx.fillStyle = grad;
                // Sombra más intensa si está al frente
                ctx.shadowColor = colorBase;
                ctx.shadowBlur = alFrente ? 15 : 5;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Borde
                ctx.strokeStyle = alFrente ? '#fff' : 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Texto
                ctx.fillStyle = alFrente ? '#000' : '#666'; // Texto oscuro si está al frente, gris si atrás
                ctx.font = `bold ${luna.size * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(luna.num.toString().padStart(2, '0'), x, y);
            }

            // Ajustar tamaño si la ventana cambia
            const resizeObserver = new ResizeObserver(() => {
                width = canvas.clientWidth;
                height = canvas.clientHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            });
            resizeObserver.observe(canvas.parentElement);

            // Iniciar
            dibujar();
        }

        // Limpiar animación al salir
        window.addEventListener('beforeunload', () => {
            if (radarAnimationId) cancelAnimationFrame(radarAnimationId);
        });

    </script>
</body>
</html>
